<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>bap · invite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" rel="stylesheet">
<!-- bap's invite skin over the shared machinery (/admin/assets/setpw.js). -->
<style>
  :root { --ink: #0b0b0b; --soft: #9a9a9a; --red: #e0533d; --blue-deep: #1c6fae; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff; color: var(--ink);
    font-family: "Gochi Hand", cursive;
    min-height: 100svh;
    display: flex; align-items: center; justify-content: center;
    padding: 1.25rem;
  }
  .box {
    width: min(340px, 90vw);
    border: 3px solid var(--ink);
    border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
    padding: 36px 34px 30px;
    text-align: center;
    transform: rotate(-.6deg);
  }
  .t { font-size: 64px; line-height: 1; }
  .sub { color: var(--soft); font-size: 20px; margin-top: 6px; }
  input {
    display: block; width: 100%;
    font-family: inherit; font-size: 24px; color: var(--ink);
    border: none; border-bottom: 3px solid var(--ink);
    border-radius: 0 0 120px 8px / 0 0 10px 6px;
    outline: none; background: transparent;
    margin-top: 26px; padding: 2px 4px; text-align: center;
  }
  input[readonly] { color: var(--soft); border-bottom-style: dotted; }
  input:disabled, button:disabled { opacity: .5; }
  button {
    font-family: inherit; font-size: 28px; color: var(--ink);
    background: #fff; cursor: pointer; padding: 4px 30px 0;
    margin-top: 30px;
    border: 3px solid var(--ink);
    border-radius: 18px 225px 18px 255px / 225px 18px 255px 18px;
  }
  button:hover { transform: scale(1.05) rotate(1.5deg); }
  .msg { font-size: 20px; min-height: 1.4em; margin-top: 12px; }
  .err { color: var(--red); }
  a { color: var(--blue-deep); }
</style>
</head>
<body>
<div class="box">
  <div class="t">meow?</div>
  <div class="sub">pick a password</div>
  <form data-pw="form">
    <p class="msg err" data-pw="nocode" hidden>open this from your invite link.</p>
    <input data-pw="username" name="username" autocomplete="username" readonly>
    <input data-pw="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="password" required>
    <button type="submit" data-pw="submit">bap in</button>
    <p class="msg err" data-pw="msg"></p>
  </form>
  <div data-pw="done" hidden>
    <p class="msg">hi, <b data-pw="name"></b>. <a data-pw="enter" href="/bap/">go bap →</a></p>
  </div>
  <p class="msg err" data-pw="invalid" hidden>this invite is void or expired.</p>
</div>
<script src="/admin/assets/setpw.js?v=1"></script>
<script>SetPassword.mount();</script>
</body>
</html>
