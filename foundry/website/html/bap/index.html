<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>bap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b0b0b;
    --soft: #9a9a9a;
    --blue: #4aa8e0;
    --blue-deep: #1c6fae;
    --red: #e0533d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #fff;
    color: var(--ink);
    font-family: "Gochi Hand", cursive;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  #stage { position: fixed; inset: 0; cursor: pointer; }

  /* ---- scene (1800x1000 design space, scaled by JS) ---- */
  #scene {
    position: absolute; left: 0; top: 0;
    width: 1800px; height: 1560px;
    transform-origin: 0 0;
  }
  #tableAndCup { position: absolute; inset: 0; overflow: visible; z-index: 1; pointer-events: none; }
  /* the cup + shards render above the cat: they're nearer the viewer */
  #cupfx { position: absolute; inset: 0; overflow: visible; z-index: 3; pointer-events: none; }
  /* cat sits ABOVE the table line; the clip hides the sprite's low-slung
     slam paws + resting beans (drawn for bongo.cat's tall instruments) so
     only the head peeks over the edge and arms flick over it */
  #cat { position: absolute; left: 0; top: 40px; width: 800px; height: 900px; pointer-events: none; z-index: 2;
         clip-path: polygon(0 0, 100% 0, 100% 230px, 0 70px); }
  #cat .layer {
    position: absolute; inset: 0;
    background-repeat: no-repeat;
    background-size: 1600px 900px;
    background-position: 0 0;
  }
  #cat #head { background-image: url(img/cat.png); background-size: 800px 900px; }
  #cat #mouth { background-image: url(img/mouth.png); }
  #cat #pawL { background-image: url(img/paw-left.png); }
  #cat #pawR { background-image: url(img/paw-right.png); }
  #cat .layer.down { background-position-x: -800px; }

  /* ---- login ---- */
  #login {
    position: fixed; inset: 0; z-index: 10;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  #login .box {
    width: min(320px, 86vw);
    border: 3px solid var(--ink);
    border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
    padding: 34px 34px 28px;
    text-align: center;
    transform: rotate(-.6deg);
  }
  #login .t { font-size: 64px; line-height: 1; }
  #login input {
    display: block; width: 100%;
    font-family: inherit; font-size: 24px; color: var(--ink);
    border: none; border-bottom: 3px solid var(--ink);
    border-radius: 0 0 120px 8px / 0 0 10px 6px;
    outline: none; background: transparent;
    margin-top: 26px; padding: 2px 4px; text-align: center;
  }
  #login input::placeholder { color: #cfcfcf; }
  #login button {
    font-family: inherit; font-size: 28px; color: var(--ink);
    background: #fff; cursor: pointer; padding: 4px 30px 0;
    margin-top: 30px;
    border: 3px solid var(--ink);
    border-radius: 18px 225px 18px 255px / 225px 18px 255px 18px;
  }
  #login button:hover { transform: scale(1.05) rotate(1.5deg); }
  #login .msg { color: var(--red); font-size: 20px; min-height: 1.4em; margin-top: 12px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="scene">
    <svg id="tableAndCup" viewBox="0 0 1800 1560" fill="none">
      <g id="tableG" stroke="var(--ink)" stroke-linecap="round" stroke-linejoin="round">
        <!-- a long birch table receding toward the viewer: far edge (bapped)
             runs under the chin; the front rim plunges down-left all the way
             to the left screen edge. Thick slab; one 3D leg near the corner. -->
        <path fill="#f8f0e0" stroke="none" d="M -40 102
          C 220 154, 460 202, 700 250 S 940 298, 1000 310
          C 700 620, 370 950, -40 1356 Z"/>
        <!-- leg, inset a little down the edge from the corner: front face +
             thinner right side face; all three lines vertical from the
             table's underside down to a flat foot -->
        <path fill="#dcc69e" stroke-width="8" d="M 914 451 L 932 433 L 932 1232 L 914 1250 Z"/>
        <path fill="#efe3c8" stroke-width="8" d="M 870 496 L 914 451 L 914 1250 L 870 1250 Z"/>
        <!-- slab thickness -->
        <path fill="#e9dabb" stroke="none" d="M 1000 310
          C 700 620, 370 950, -40 1356 L -40 1411
          C 375 1000, 705 670, 1000 365 Z"/>
        <path id="tabletop" fill="none" stroke-width="15" d="M -40 102
          C 220 154, 460 202, 700 250
          S 940 298, 1000 310"/>
        <path fill="none" stroke-width="13" d="M 1000 310 C 700 620, 370 950, -40 1356"/>
        <path fill="none" stroke-width="10" d="M 1000 365 C 705 670, 375 1000, -40 1411"/>
        <path stroke-width="10" d="M 1000 312 L 1000 363"/>
      </g>
    </svg>
    <svg id="cupfx" viewBox="0 0 1800 1560" fill="none">
      <!-- slam paws: shown while the sprite's arms are down, sitting over
           the table edge right where the clipped arms end -->
      <g id="slamL" class="hidden" transform="translate(372 190) rotate(11)">
        <path d="M -33 6 Q -34 -23 -11 -27 Q 0 -28 11 -27 Q 34 -23 33 6 Q 23 20 0 22 Q -23 20 -33 6 Z"
              fill="#fff" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
      </g>
      <g id="slamR" class="hidden" transform="translate(548 225) rotate(11)">
        <path d="M -33 6 Q -34 -23 -11 -27 Q 0 -28 11 -27 Q 34 -23 33 6 Q 23 20 0 22 Q -23 20 -33 6 Z"
              fill="#fff" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
      </g>
      <g id="cupG"></g>
      <g id="fxG"></g>
    </svg>
    <div id="cat">
      <div class="layer" id="head"></div>
      <div class="layer" id="mouth"></div>
      <div class="layer" id="pawL"></div>
      <div class="layer" id="pawR"></div>
    </div>
  </div>
</div>

<div id="login" class="hidden">
  <form class="box" id="loginForm">
    <div class="t">bap</div>
    <input id="lu" autocomplete="username" placeholder="name" required>
    <input id="lp" type="password" autocomplete="current-password" placeholder="password" required>
    <button type="submit">in</button>
    <div class="msg" id="lmsg"></div>
  </form>
</div>

<script>
"use strict";
const AUTH = "/admin/api";
const API = "/bap/api";
const $ = id => document.getElementById(id);

/* ================= scene scaling ================= */
const SW = 1800, SH = 1560;
const TOP_MARGIN = 28; // constant screen-px breathing room above the cat
function fit() {
  const s = Math.min(innerWidth / 1500, (innerHeight - TOP_MARGIN * 2) / SH);
  $("scene").style.transform =
    `translate(0px, ${Math.max(TOP_MARGIN, (innerHeight - SH * s) / 2)}px) scale(${s})`;
}
addEventListener("resize", fit); fit();

/* ================= table geometry =================
   The tabletop path above approximates the line y(x) below; the cup
   rides that line. t is the cup's fractional position (0 home, 1 edge). */
// The cup starts lined up under the cat's LEFT paw, deep on the table
// (~420px in from the far edge — 4x the old inset), and rides a track
// parallel to the far edge until the track crosses the front rim.
const TAB = { x0: 440, x1: 640, slope: 0.20, yAt: x => 624 + 0.20 * (x - 470) };
const EDGE_X = 650;           // center of gravity past this -> tip off
const FLOOR_Y = 1440;         // floor in FRONT of the table — below even the
                              // rim's left-edge exit (y~1356), pixelwise
// Real-ish gravity: the cup is ~150px for a ~15cm tumbler, so 1px ~ 1mm
// and true g would be 9800 px/s². 8200 keeps it snappy but playable.
const GRAV = 8200;
const CATCH = 22;             // lift below this while descending -> a bap can catch it
const SLOPE_DEG = Math.atan(TAB.slope) * 180 / Math.PI;

/* ================= cup drawing ================= */
const NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function drawCup(outer) {
  outer.innerHTML = "";
  const g = el("g", { transform: "scale(1.0)" }, outer);
  const body = el("path", {
    d: `M -48 -148 C -46 -96, -40 -40, -33 -4
        Q -32 2, -24 3 L 24 3 Q 32 2, 33 -4
        C 40 -40, 46 -96, 48 -148
        C 20 -156, -20 -156, -48 -148 Z`,
    fill: "#79c4ef", "fill-opacity": ".5",
    stroke: "var(--blue-deep)", "stroke-width": "6.5",
    "stroke-linejoin": "round",
  }, g);
  el("ellipse", { cx: 0, cy: -148, rx: 47, ry: 11,
    fill: "#c8e8fa", "fill-opacity": ".55",
    stroke: "var(--blue-deep)", "stroke-width": "5.5" }, g);
  // faceted lower half, scalloped tops (like the diner tumbler)
  const fac = el("g", { stroke: "var(--blue-deep)", "stroke-opacity": ".45",
    "stroke-width": "3.5", "stroke-linecap": "round" }, g);
  el("path", { d: "M -20 -86 C -19 -56, -17 -26, -15 -6" }, fac);
  el("path", { d: "M 20 -86 C 19 -56, 17 -26, 15 -6" }, fac);
  el("path", { d: "M -38 -84 Q -29 -98 -20 -86 Q -10 -100 0 -88 Q 10 -100 20 -86 Q 29 -98 38 -84" }, fac);
  // marker highlight
  el("path", { d: "M -34 -132 C -33 -108, -30 -70, -26 -40", stroke: "#fff",
    "stroke-opacity": ".85", "stroke-width": "7", "stroke-linecap": "round" }, g);
  return g;
}
const cupG = $("cupG");
drawCup(cupG);

/* ================= state ================= */
const cup = {
  t: 0,           // 0..1 along table
  lift: 0, vLift: 0,      // hop above the table
  wob: 0, vWob: 0,        // wobble around resting tilt
  mode: "table",          // table | falling | broken
  fx: 0, fy: 0, fvx: 0, fvy: 0, frot: 0, fvr: 0, // falling body
};
let baps = 0, shatters = 0, dirty = false, user = null;

function cupXY() {
  const x = TAB.x0 + cup.t * (TAB.x1 - TAB.x0);
  return { x, y: TAB.yAt(x) - 4 };
}
function renderCup() {
  if (cup.mode === "broken") { cupG.setAttribute("visibility", "hidden"); return; }
  cupG.setAttribute("visibility", "visible");
  let x, y, rot;
  if (cup.mode === "falling") { x = cup.fx; y = cup.fy; rot = cup.frot; }
  else { const p = cupXY(); x = p.x; y = p.y - cup.lift; rot = cup.wob; }
  cupG.setAttribute("transform", `translate(${x} ${y}) rotate(${rot})`);
}
renderCup();

/* ================= physics loop ================= */
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (cup.mode === "table") {
    if (cup.lift > 0 || cup.vLift !== 0) {
      cup.vLift -= GRAV * dt;
      cup.lift += cup.vLift * dt;
      if (cup.lift <= 0) {
        if (cup.vLift < -180) sndRattle(Math.min(1, -cup.vLift / 1400));
        cup.lift = 0; cup.vLift = 0;
      }
    }
    // wobble spring
    cup.vWob += (-70 * cup.wob - 6 * cup.vWob) * dt;
    cup.wob += cup.vWob * dt;
    // tip off the edge
    if (cupXY().x > EDGE_X && cup.lift === 0) startFall();
  } else if (cup.mode === "falling") {
    cup.fvy += GRAV * dt;
    cup.fx += cup.fvx * dt; cup.fy += cup.fvy * dt;
    cup.frot += cup.fvr * dt;
    if (cup.fy >= FLOOR_Y) shatter();
  }
  renderCup();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function startFall() {
  const p = cupXY();
  cup.mode = "falling";
  cup.fx = p.x; cup.fy = p.y;
  cup.fvx = 140 + Math.random() * 160; cup.fvy = -40;
  cup.frot = 0; cup.fvr = 170 + Math.random() * 160;
}

/* ================= shatter ================= */
const fxG = $("fxG");
function shatter() {
  cup.mode = "broken";
  shatters += 1; dirty = true; save();
  if (Math.random() < 0.25) {
    sndSparkle();
    burstHearts(cup.fx, FLOOR_Y, true);
  } else {
    sndCrash();
    drawWreck(cup.fx, FLOOR_Y, true);
  }
}
const HEART = "M 0 5 C -1 2, -4 0, -7 0 C -11 0, -13 3, -13 6 C -13 11, -7 15, 0 20 C 7 15, 13 11, 13 6 C 13 3, 11 0, 7 0 C 4 0, 1 2, 0 5 Z";
// Animate the SVG transform ATTRIBUTE directly (rAF), like the cup does.
// CSS/WAAPI transforms on SVG children have different origin/parsing
// semantics than the attribute, which made effects "jump" when they ended.
function setT(elm, x, y, r, s) {
  elm.setAttribute("transform", `translate(${x} ${y}) rotate(${r}) scale(${s})`);
}
function tweenT(elm, from, to, dur) {
  const t0 = performance.now();
  (function fr(now) {
    const u = Math.min(1, (now - t0) / dur);
    const v = 1 - Math.pow(1 - u, 3); // easeOutCubic
    setT(elm,
      from.x + (to.x - from.x) * v, from.y + (to.y - from.y) * v,
      from.r + (to.r - from.r) * v, from.s + (to.s - from.s) * v);
    if (u < 1) requestAnimationFrame(fr);
  })(t0);
}
// quadratic-bezier flight (for hearts hopping out of the impact)
function flyT(elm, p0, pc, p1, rot, s0, s1, dur) {
  const t0 = performance.now();
  (function fr(now) {
    const u = Math.min(1, (now - t0) / dur), w = 1 - u;
    setT(elm,
      w * w * p0.x + 2 * w * u * pc.x + u * u * p1.x,
      w * w * p0.y + 2 * w * u * pc.y + u * u * p1.y,
      rot * u, s0 + (s1 - s0) * u);
    if (u < 1) requestAnimationFrame(fr);
  })(t0);
}
// sample a point in the perspective floor disc (same projection as shards)
function floorDisc(R) {
  const th = Math.random() * Math.PI * 2;
  const rr = R * Math.sqrt(Math.random());
  return {
    dx: 0.98 * rr * Math.cos(th) - 0.35 * rr * Math.sin(th),
    dy: 0.196 * rr * Math.cos(th) + 0.355 * rr * Math.sin(th),
  };
}
function burstHearts(cx, cy, animate) {
  fxG.innerHTML = "";
  const pinks = ["#f78fb0", "#fba7c0", "#ef7aa2", "#f95f96"];
  for (let i = 0; i < 30; i++) {
    const p = floorDisc(170);
    const x1 = cx + p.dx, y1 = cy - 14 + p.dy;         // where this heart settles (and stays)
    const sc = 0.6 + Math.random() * 1.3;
    const rot = (Math.random() - 0.5) * 90;
    const h = el("path", { d: HEART, fill: pinks[i % pinks.length],
      stroke: "#e06a92", "stroke-width": "3", "stroke-linejoin": "round",
      transform: `translate(${x1} ${y1}) rotate(${rot}) scale(${sc})` }, fxG);
    // hop out of the impact point in a little arc, then rest exactly there
    if (animate) flyT(h,
      { x: cx, y: cy - 40 },
      { x: (cx + x1) / 2, y: Math.min(cy, y1) - 120 - Math.random() * 90 },
      { x: x1, y: y1 },
      rot, sc * 0.5, sc, 550 + Math.random() * 450);
  }
}
function drawWreck(cx, cy, animate) {
  fxG.innerHTML = "";
  el("ellipse", { cx: 0, cy: 0, rx: 95, ry: 28, fill: "#7cc4ee", "fill-opacity": ".35",
    transform: `translate(${cx} ${cy + 8}) rotate(11)` }, fxG);
  const shapes = [
    "M 0 0 L 26 -34 L 38 -4 Z", "M 0 0 L -30 -26 L -12 -40 L -4 -6 Z",
    "M 0 0 L 18 -20 L 30 -22 L 12 -2 Z", "M 0 0 L -22 -14 L -34 -2 Z",
    "M 0 0 L 8 -26 L -6 -24 Z", "M 0 0 L 40 -12 L 46 -2 Z", "M 0 0 L -44 -8 L -50 0 Z",
  ];
  // Shards land inside a circle on the FLOOR PLANE, projected to screen:
  // lateral basis u = along the far edge (1, 0.2)-ish, depth basis v = along
  // the rim, foreshortened — a circle becomes a sheared ellipse.
  const R = 150;
  const N = 13;
  for (let i = 0; i < N; i++) {
    const d = shapes[i % shapes.length];
    const far = i % 4 === 3 ? 2.2 + Math.random() * 1.1 : 1; // some fly way out
    const th = Math.random() * Math.PI * 2;
    const rr = R * Math.sqrt(Math.random()) * far;
    const dx = 0.98 * rr * Math.cos(th) - 0.35 * rr * Math.sin(th);
    const dy = 0.196 * rr * Math.cos(th) + 0.355 * rr * Math.sin(th);
    const rot = (Math.random() - 0.5) * 110;
    const sc = 0.65 + Math.random() * 0.75;
    const s = el("path", { d, fill: "#79c4ef", "fill-opacity": ".5",
      stroke: "var(--blue-deep)", "stroke-width": "4", "stroke-linejoin": "round",
      transform: `translate(${cx + dx} ${cy + dy}) rotate(${rot}) scale(${sc})` }, fxG);
    if (animate) tweenT(s, { x: cx, y: cy - 30, r: 0, s: sc },
      { x: cx + dx, y: cy + dy, r: rot, s: sc },
      220 + Math.abs(dx) * 0.9 + i * 12);
  }
  if (animate) for (let i = 0; i < 7; i++) {
    const a = -Math.PI * (0.15 + 0.7 * Math.random());
    const v = 220 + Math.random() * 240, r = 3 + Math.random() * 4.5;
    const d = el("circle", { cx: 0, cy: 0, r, fill: "var(--blue)" }, fxG);
    const vx = Math.cos(a) * v * (Math.random() < 0.5 ? 1 : -1), vy = Math.sin(a) * v;
    const t0 = performance.now();
    (function fr(now) {
      const u = Math.min(1, (now - t0) / 460);
      d.setAttribute("transform",
        `translate(${cx + vx * 0.35 * u} ${cy - 8 + (vy * 0.35 + 145) * u * u})`);
      d.setAttribute("opacity", String(1 - u));
      if (u < 1) requestAnimationFrame(fr); else d.remove();
    })(t0);
  }
}

/* ================= bap! ================= */
const pawEls = [$("pawL"), $("pawR")];
let pawTurn = 0, mouthTimer = 0;
const tableSvg = $("tableAndCup"), cupSvg = $("cupfx"), headEl = $("head");

function bap() {
  const I = 0.15 + 0.85 * Math.pow(Math.random(), 1.6); // mostly gentle, sometimes THWACK
  baps += 1; dirty = true;
  sndThump(I);

  // paws — sprite frame down + drawn slam paw over the table edge
  // (paw-right.png slams on the screen-left side and vice versa)
  const slamFor = p => $(p.id === "pawR" ? "slamL" : "slamR");
  const both = I > 0.8;
  const paws = both ? pawEls : [pawEls[pawTurn ^= 1]];
  paws.forEach(p => { p.classList.add("down"); slamFor(p).classList.remove("hidden"); });
  setTimeout(() => paws.forEach(p => {
    p.classList.remove("down"); slamFor(p).classList.add("hidden");
  }), 90 + I * 60);
  if (I > 0.7) {
    $("mouth").classList.add("down");
    clearTimeout(mouthTimer);
    mouthTimer = setTimeout(() => $("mouth").classList.remove("down"), 300);
  }
  headEl.animate(
    [{ transform: "translateY(0)" }, { transform: `translateY(${2 + 4 * I}px)` }, { transform: "translateY(0)" }],
    { duration: 130, easing: "ease-out" });

  // table shake (cup layer shakes with it)
  const A = 1.5 + 11 * I;
  for (const el of [tableSvg, cupSvg]) el.animate([
    { transform: "translate(0,0) rotate(0deg)" },
    { transform: `translate(${-A * 0.4}px, ${A}px) rotate(${-0.12 * I}deg)` },
    { transform: `translate(${A * 0.3}px, ${-A * 0.6}px)` },
    { transform: `translate(${-A * 0.15}px, ${A * 0.35}px)` },
    { transform: "translate(0,0) rotate(0deg)" },
  ], { duration: 230 + I * 120, easing: "ease-out" });

  // cup response — the table can only push a cup it's touching
  if (cup.mode === "table") {
    if (cup.lift === 0) {
      cup.vLift = 120 + 820 * I * (0.6 + 0.4 * Math.random());
      cup.vWob += (Math.random() < 0.5 ? -1 : 1) * (30 + 260 * I);
      if (I > 0.32) {
        const dx = Math.pow(I, 1.7) * (26 + 44 * Math.random());
        cup.t = cup.t + dx / (TAB.x1 - TAB.x0);
      }
      save();
    } else if (cup.lift < CATCH && cup.vLift < 0) {
      // resonant catch: the rising table meets the falling cup and the
      // energies superimpose — bigger, more chaotic bounce
      cup.vLift = Math.min(1500, -cup.vLift * 1.15 + 250 + 900 * I);
      cup.vWob += (Math.random() < 0.5 ? -1 : 1) * (120 + 420 * I);
      const dx = Math.pow(I, 1.4) * (10 + 60 * Math.random()) * (Math.random() < 0.25 ? -0.4 : 1);
      cup.t = cup.t + dx / (TAB.x1 - TAB.x0);
      sndRattle(0.6);
      save();
    }
    // otherwise the cup is midair — the bap can't reach it
  }
}

$("stage").addEventListener("pointerdown", () => bap());
addEventListener("keydown", e => {
  if (e.code === "Space" && !$("login").offsetParent) { e.preventDefault(); bap(); }
});

/* ================= sound (synthesized) ================= */
let ac = null;
function ctx() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); return ac; }
function sndThump(I) {
  try {
    const a = ctx(), t = a.currentTime, g = a.createGain();
    g.gain.setValueAtTime(0.25 * I * I + 0.04, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    const o = a.createOscillator();
    o.frequency.setValueAtTime(90 + 40 * I, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 0.14);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + 0.17);
  } catch (_) {}
}
function noiseBurst(dur, freq, q, gain) {
  const a = ctx(), t = a.currentTime;
  const n = a.createBufferSource(), buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
  n.buffer = buf;
  const f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
  const g = a.createGain(); g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  n.connect(f).connect(g).connect(a.destination);
  n.start(t);
}
function sndRattle(I) { try { noiseBurst(0.06, 2600, 8, 0.10 * I); } catch (_) {} }
function sndSparkle() {
  try {
    const a = ctx(), t = a.currentTime;
    [880, 1175, 1568, 2093].forEach((f, i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i * 0.07);
      g.gain.exponentialRampToValueAtTime(0.11, t + i * 0.07 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.07 + 0.35);
      o.connect(g).connect(a.destination);
      o.start(t + i * 0.07); o.stop(t + i * 0.07 + 0.4);
    });
  } catch (_) {}
}
function sndCrash() {
  try {
    noiseBurst(0.5, 3200, 1.2, 0.30);
    setTimeout(() => noiseBurst(0.25, 4200, 6, 0.12), 70);
    setTimeout(() => noiseBurst(0.18, 5200, 8, 0.07), 160);
  } catch (_) {}
}

/* ================= persistence ================= */
let saveTimer = 0;
function stateBody() {
  return JSON.stringify({
    cup_x: Math.min(1, Math.max(0, cup.t)),
    baps, broken: cup.mode === "broken", shatters,
  });
}
function save() {
  if (!user) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    dirty = false;
    const res = await fetch(`${API}/state`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: stateBody(),
    }).catch(() => null);
    if (res && res.status === 401) showLogin();
  }, 700);
}
addEventListener("pagehide", () => {
  if (user && dirty) {
    clearTimeout(saveTimer);
    fetch(`${API}/state`, {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: stateBody(), keepalive: true,
    }).catch(() => {});
  }
});

/* ================= auth ================= */
function showLogin() {
  user = null;
  $("login").classList.remove("hidden");
  $("lu").focus();
}
async function enter(me) {
  user = me;
  $("login").classList.add("hidden");
  if (TEST) return; // test hooks own the scene; don't clear/redraw over them
  const res = await fetch(`${API}/state`).catch(() => null);
  if (res && res.ok) {
    const st = await res.json();
    baps = st.baps || 0; shatters = st.shatters || 0;
    fxG.innerHTML = "";
    cup.mode = "table";
    if (st.broken) {
      // a broken cup resets on refresh: fresh cup at home
      cup.t = 0;
      dirty = true; save();
    } else {
      cup.t = Math.min(1, Math.max(0, st.cup_x || 0));
    }
    renderCup();
  }
}
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("lmsg").textContent = "";
  const res = await fetch(`${AUTH}/login`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: $("lu").value.trim(), password: $("lp").value }),
  }).catch(() => null);
  if (!res || !res.ok) { $("lmsg").textContent = "nope."; return; }
  enter(await res.json());
});
// visual test hooks (harmless in prod; synchronous so screenshots are deterministic)
const TEST = new URLSearchParams(location.search).get("test");
function applyTest() {
  if (TEST === "down") {
    $("pawL").classList.add("down"); $("pawR").classList.add("down"); $("mouth").classList.add("down");
    $("slamL").classList.remove("hidden"); $("slamR").classList.remove("hidden");
  }
  if (TEST === "mid") { cup.t = 0.75; }
  if (TEST === "broken") { cup.mode = "broken"; drawWreck(780, FLOOR_Y, false); }
  if (TEST === "hearts") { cup.mode = "broken"; burstHearts(780, FLOOR_Y, false); }
  if (TEST) renderCup();
}
applyTest();

(async function boot() {
  const res = await fetch(`${AUTH}/me`).catch(() => null);
  if (res && res.ok) await enter(await res.json());
  else showLogin();
})();
</script>
