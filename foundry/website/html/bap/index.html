<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>bap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Great+Vibes&family=Playfair+Display:wght@800&family=Cormorant+Garamond:wght@600&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b0b0b;
    --soft: #9a9a9a;
    --blue: #4aa8e0;
    --blue-deep: #1c6fae;
    --red: #e0533d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #fff;
    color: var(--ink);
    font-family: "Gochi Hand", cursive;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  /* clip on the stage, NOT the body — body overflow:hidden kills
     mobile pull-to-refresh */
  #stage { position: fixed; inset: 0; cursor: pointer; overflow: hidden; }

  /* ---- scene (1800x1000 design space, scaled by JS) ---- */
  #scene {
    position: absolute; left: 0; top: 0;
    width: 1800px; height: 1560px;
    transform-origin: 0 0;
    visibility: hidden; /* revealed once state (and cup color) is settled */
  }
  #tableAndCup { position: absolute; inset: 0; overflow: visible; z-index: 1; pointer-events: none; }
  /* the cup + shards render above the cat: they're nearer the viewer */
  #cupfx { position: absolute; inset: 0; overflow: visible; z-index: 3; pointer-events: none; }
  /* cat sits ABOVE the table line; the clip hides the sprite's low-slung
     slam paws + resting beans (drawn for bongo.cat's tall instruments) so
     only the head peeks over the edge and arms flick over it */
  #cat { position: absolute; left: 0; top: 40px; width: 800px; height: 900px; pointer-events: none; z-index: 2;
         clip-path: polygon(0 0, 100% 0, 100% 230px, 0 70px); }
  #cat .layer {
    position: absolute; inset: 0;
    background-repeat: no-repeat;
    background-size: 1600px 900px;
    background-position: 0 0;
  }
  #cat #head { background-image: url(img/cat.png); background-size: 800px 900px; }
  #cat #mouth { background-image: url(img/mouth.png); }
  #cat #pawL { background-image: url(img/paw-left.png); }
  #cat #pawR { background-image: url(img/paw-right.png); }
  #cat .layer.down { background-position-x: -800px; }

  /* ---- login ---- */
  #login {
    position: fixed; inset: 0; z-index: 10;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  #login .box {
    width: min(320px, 86vw);
    border: 3px solid var(--ink);
    border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
    padding: 34px 34px 28px;
    text-align: center;
    transform: rotate(-.6deg);
  }
  #login .t { font-size: 64px; line-height: 1; }
  #login input {
    display: block; width: 100%;
    font-family: inherit; font-size: 24px; color: var(--ink);
    border: none; border-bottom: 3px solid var(--ink);
    border-radius: 0 0 120px 8px / 0 0 10px 6px;
    outline: none; background: transparent;
    margin-top: 26px; padding: 2px 4px; text-align: center;
  }
  #login input::placeholder { color: #cfcfcf; }
  #login button {
    font-family: inherit; font-size: 28px; color: var(--ink);
    background: #fff; cursor: pointer; padding: 4px 30px 0;
    margin-top: 30px;
    border: 3px solid var(--ink);
    border-radius: 18px 225px 18px 255px / 225px 18px 255px 18px;
  }
  #login button:hover { transform: scale(1.05) rotate(1.5deg); }
  #login .msg { color: var(--red); font-size: 20px; min-height: 1.4em; margin-top: 12px; }
  /* ---- the birthday card (opened by clicking the chocolate) ---- */
  #card {
    position: fixed; inset: 0; z-index: 9;
    background: rgba(255,255,255,.86);
    display: flex; align-items: center; justify-content: center;
    cursor: default;
  }
  #card .fold {
    position: relative; z-index: 1;
    width: min(480px, 88vw);
    aspect-ratio: 164 / 128;   /* the card on the table */
    display: flex; flex-direction: column; justify-content: center;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 18px 225px 18px 255px / 225px 18px 255px 18px;
    padding: 22px 26px 26px;
    text-align: center;
    transform: rotate(-1.2deg);
    animation: cardIn .26s ease-out;
  }
  @keyframes cardIn { from { transform: rotate(-1.2deg) scale(.86); opacity: 0; } }
  #card .fold svg { width: 42%; height: auto; display: block; margin: 0 auto 6px; }
  #card p { font-size: clamp(24px, 6.5vw, 34px); line-height: 1.15; }
  #card p + p { margin-top: 8px; }
  /* the sleeve itself, lying behind the card's lower right corner */
  #card .pack {
    position: absolute; z-index: 0;
    left: calc(50% + 172px); top: calc(50% - 72px);
    width: min(280px, calc((50vh + 50px) / 1.84));
    transform: rotate(8deg);
  }
  #card .pack svg { width: 100%; height: auto; display: block; margin: 0; }
  @media (max-width: 600px) {
    #card { padding-bottom: 26vh; }
    #card .pack { left: auto; right: -2vw; top: auto; bottom: 2vh;
      width: min(62vw, calc(60vh / 1.84)); }
  }
  .hidden { display: none !important; }
</style>
</head>

<script>
"use strict";
const AUTH = "/admin/api";
const API = "/bap/api";
const $ = id => document.getElementById(id);

/* ================= scene scaling ================= */
const SW = 1800, SH = 1560;
const TOP_MARGIN = 28; // constant screen-px breathing room above the cat
function fit() {
  const s = Math.min(innerWidth / 1500, (innerHeight - TOP_MARGIN * 2) / SH);
  $("scene").style.transform =
    `translate(0px, ${Math.max(TOP_MARGIN, (innerHeight - SH * s) / 2)}px) scale(${s})`;
}
addEventListener("resize", fit); fit();

/* ================= table geometry =================
   The tabletop path above approximates the line y(x) below; the cup
   rides that line. t is the cup's fractional position (0 home, 1 edge). */
// The cup starts lined up under the cat's LEFT paw, deep on the table
// (~420px in from the far edge — 4x the old inset), and rides a track
// parallel to the far edge until the track crosses the front rim.
const TAB = { x0: 440, x1: 640, slope: 0.20, yAt: x => 624 + 0.20 * (x - 470) };
const EDGE_X = 650;           // center of gravity past this -> tip off
const FLOOR_Y = 1440;         // floor in FRONT of the table — below even the
                              // rim's left-edge exit (y~1356), pixelwise
// Real-ish gravity: the cup is ~150px for a ~15cm tumbler, so 1px ~ 1mm
// and true g would be 9800 px/s². 8200 keeps it snappy but playable.
const GRAV = 8200;
const CATCH = 22;             // lift below this while descending -> a bap can catch it
const SLOPE_DEG = Math.atan(TAB.slope) * 180 / Math.PI;

/* ================= cup drawing ================= */
const NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
// Each page load rolls a cup color (uniform). Color is NOT persisted —
// a refresh recolors the cup wherever it stands. The break effect
// follows the color: blue=glass, pink=hearts, green=guitar picks.
// ?cup=blue|green|pink forces it (for testing).
const CUP_KINDS = ["blue", "green", "pink"];
const CUP_STYLES = {
  blue:  { body: "#79c4ef", stroke: "#1c6fae", rim: "#c8e8fa" },
  green: { body: "#57a06b", stroke: "#1d5c38", rim: "#a9d8bb" },
  pink:  { body: "#f7a8c4", stroke: "#c2517e", rim: "#fbd3e2" },
};
const qcup = new URLSearchParams(location.search).get("cup");
let CUP_KIND = CUP_KINDS.includes(qcup) ? qcup
  : CUP_KINDS[Math.floor(Math.random() * 3)];
let CUP_STYLE = CUP_STYLES[CUP_KIND];

function drawCup(outer) {
  outer.innerHTML = "";
  const g = el("g", { transform: "scale(1.0)" }, outer);
  const body = el("path", {
    d: `M -48 -148 C -46 -96, -40 -40, -33 -4
        Q -32 2, -24 3 L 24 3 Q 32 2, 33 -4
        C 40 -40, 46 -96, 48 -148
        C 20 -156, -20 -156, -48 -148 Z`,
    fill: CUP_STYLE.body, "fill-opacity": ".5",
    stroke: CUP_STYLE.stroke, "stroke-width": "6.5",
    "stroke-linejoin": "round",
  }, g);
  el("ellipse", { cx: 0, cy: -148, rx: 47, ry: 11,
    fill: CUP_STYLE.rim, "fill-opacity": ".55",
    stroke: CUP_STYLE.stroke, "stroke-width": "5.5" }, g);
  // faceted lower half, scalloped tops (like the diner tumbler)
  const fac = el("g", { stroke: CUP_STYLE.stroke, "stroke-opacity": ".45",
    "stroke-width": "3.5", "stroke-linecap": "round" }, g);
  el("path", { d: "M -20 -86 C -19 -56, -17 -26, -15 -6" }, fac);
  el("path", { d: "M 20 -86 C 19 -56, 17 -26, 15 -6" }, fac);
  el("path", { d: "M -38 -84 Q -29 -98 -20 -86 Q -10 -100 0 -88 Q 10 -100 20 -86 Q 29 -98 38 -84" }, fac);
  // marker highlight
  el("path", { d: "M -34 -132 C -33 -108, -30 -70, -26 -40", stroke: "#fff",
    "stroke-opacity": ".85", "stroke-width": "7", "stroke-linecap": "round" }, g);
  return g;
}
const cupG = $("cupG");
drawCup(cupG);
function setCupKind(k) { CUP_KIND = k; CUP_STYLE = CUP_STYLES[k]; drawCup(cupG); }

/* ================= state ================= */
const cup = {
  t: 0,           // 0..1 along table
  lift: 0, vLift: 0,      // hop above the table
  wob: 0, vWob: 0,        // wobble around resting tilt
  mode: "table",          // table | falling | broken
  fx: 0, fy: 0, fvx: 0, fvy: 0, frot: 0, fvr: 0, // falling body
};
let baps = 0, shatters = 0, dirty = false, user = null;

function cupXY() {
  const x = TAB.x0 + cup.t * (TAB.x1 - TAB.x0);
  return { x, y: TAB.yAt(x) - 4 };
}
function renderCup() {
  if (cup.mode === "broken") { cupG.setAttribute("visibility", "hidden"); return; }
  cupG.setAttribute("visibility", "visible");
  let x, y, rot;
  if (cup.mode === "falling") { x = cup.fx; y = cup.fy; rot = cup.frot; }
  else { const p = cupXY(); x = p.x; y = p.y - cup.lift; rot = cup.wob; }
  cupG.setAttribute("transform", `translate(${x} ${y}) rotate(${rot})`);
}
renderCup();


/* ================= vase of flowers =================
   An apology bouquet, duct-taped to the table so the cat can't do to
   it what it does to cups. It's part of the table: it buzzes when the
   table is bapped (the stems sway) but it never drifts.
   TABLE_OPTS is what stands on the table for everyone:
     vase  — the glass vase of roses, duct-taped down
     sorry — the "sorry" card leaning against it (off since 2026-09-22)
     choc  — the chocolate bar on a birthday card (see drawChoc)
   ?test=flowers forces the vase, card included; ?test=choc the chocolate. */
const TABLE_OPTS = { vase: true, sorry: false, choc: false };
const VASE_AT = { x: 255, y: 770 };   // base center, scene coords
const vase = { on: false, vib: 0, sway: 0, vSway: 0 };
const vaseG = $("vaseG");
let bouquetG = null;
function tapeStrip(parent, p0, c0, c1, p1, w) {
  // a band of tape along a cubic: offset the curve both ways, torn ends
  const N = 18, L = [], R = [], T = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, u = 1 - t;
    const x = u*u*u*p0[0] + 3*u*u*t*c0[0] + 3*u*t*t*c1[0] + t*t*t*p1[0];
    const y = u*u*u*p0[1] + 3*u*u*t*c0[1] + 3*u*t*t*c1[1] + t*t*t*p1[1];
    let dx = 3*u*u*(c0[0]-p0[0]) + 6*u*t*(c1[0]-c0[0]) + 3*t*t*(p1[0]-c1[0]);
    let dy = 3*u*u*(c0[1]-p0[1]) + 6*u*t*(c1[1]-c0[1]) + 3*t*t*(p1[1]-c1[1]);
    const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
    T.push([dx, dy]);
    L.push([x - dy*w/2, y + dx*w/2]); R.push([x + dy*w/2, y - dx*w/2]);
  }
  return tapeBand(parent, L, R, T);
}
// the band itself from its two edges (L/R point rows) + unit tangents
function tapeBand(parent, L, R, T) {
  const N = L.length - 1;
  const zig = (a, b, tg) => {
    let d = "";
    for (let i = 1; i < 6; i++) {
      const s = i / 6, k = (i % 2 ? 1 : -1) * 3.5;
      d += ` L ${a[0] + (b[0]-a[0])*s + tg[0]*k} ${a[1] + (b[1]-a[1])*s + tg[1]*k}`;
    }
    return d;
  };
  let d = `M ${L[0][0]} ${L[0][1]}`;
  for (let i = 1; i <= N; i++) d += ` L ${L[i][0]} ${L[i][1]}`;
  d += zig(L[N], R[N], T[N]) + ` L ${R[N][0]} ${R[N][1]}`;
  for (let i = N - 1; i >= 0; i--) d += ` L ${R[i][0]} ${R[i][1]}`;
  d += zig(R[0], L[0], T[0]) + " Z";
  const g = el("g", {}, parent);
  el("path", { d, fill: "#c4c7cb", stroke: "var(--ink)", "stroke-width": "4",
    "stroke-linejoin": "round" }, g);
  // cloth weave: faint cross-lines
  for (let i = 2; i < N - 1; i += 2)
    el("path", { d: `M ${L[i][0]} ${L[i][1]} L ${R[i][0]} ${R[i][1]}`,
      stroke: "#8b8f94", "stroke-opacity": ".35", "stroke-width": "2" }, g);
  // sheen along one edge
  let sh = "";
  for (let i = 3; i <= N - 3; i++) {
    const x = (L[i][0]*3 + R[i][0]) / 4, y = (L[i][1]*3 + R[i][1]) / 4;
    sh += (sh ? " L " : "M ") + `${x} ${y}`;
  }
  el("path", { d: sh, stroke: "#fff", "stroke-opacity": ".6", "stroke-width": "4",
    "stroke-linecap": "round", fill: "none" }, g);
  return g;
}
function drawVase(outer, opts = TABLE_OPTS) {
  outer.innerHTML = "";

function renderVase() {
  if (!vase.on) return;
  const jx = (Math.random() - 0.5) * 2 * vase.vib, jy = (Math.random() - 0.5) * vase.vib;

  if (bouquetG) bouquetG.setAttribute("transform", `rotate(${vase.sway} 0 -170)`);
}

/* ================= chocolate on a birthday card =================
   A Dolfin "Poivre rose" bar (pale pink sleeve, hot-pink band along one
   long edge, a sprig of pink peppercorns) lying across a birthday card,
   one strip of duct tape over it holding it down. Both are drawn in the
   TABLE PLANE: local x runs along the far edge, local y toward the
   viewer, foreshortened like the floor disc; the bar's top face is the
   underside raised by its thickness (straight up on screen). The print
   is far too small to read — it's a texture. Clicking it opens the card
   (#card), whose own drawing is the same bar with a candle on it.
   TABLE_OPTS.choc / ?test=choc. */
const CHOC_AT = { x: 700, y: 430 };
const PLANE = "matrix(0.98 0.196 -0.35 0.355 0 0)";
const BAR = { W: 186, H: 104, T: 7, ROT: -17 };
const CHOC_PINK = "#e6397d", CHOC_INK = "var(--ink)";
const chocG = $("chocG");
// the sleeve's face, in the bar's own frame (centered, W by H)
function barFace(parent) {
  const { W, H } = BAR, PINK = CHOC_PINK, INK = CHOC_INK;
  el("rect", { x: -W / 2, y: -H / 2, width: W, height: H, rx: 2, fill: "#f7e1e8",
    stroke: INK, "stroke-width": "4", "stroke-linejoin": "round" }, parent);
  // hot-pink band along the far long edge (the flap)
  el("rect", { x: -W / 2 + 2, y: -H / 2 + 2, width: W - 4, height: 10, fill: PINK }, parent);
  // the print, left to right as on the sleeve: net weight, four lines of
  // description, "Poivre rose" with the sprig over it, CHOCOLAT NOIR with
  // the gold pod, the Dolfin script, the little round seal
  const serif = "Georgia, 'Times New Roman', serif";
  el("path", { d: "M -80 -14 L -80 18", stroke: "#9a9a9a", "stroke-width": "1.4" }, parent);
  [-64, -58, -52, -46].forEach((x, i) => el("path", { d: `M ${x} -30 L ${x} ${30 - i * 3}`,
    stroke: "#555", "stroke-width": "1.6", "stroke-linecap": "round" }, parent));
  const pr = el("text", { transform: "translate(-28 0) rotate(90)", "text-anchor": "middle",
    "font-size": "16", "font-family": serif, fill: "#161616" }, parent);
  pr.textContent = "Poivre rose";
  const sprig = el("g", { stroke: "#d6538d", fill: "none", "stroke-linecap": "round" }, parent);
  el("path", { d: "M -8 -38 C -18 -22, -30 -6, -42 22", "stroke-width": "2.2" }, sprig);
  el("path", { d: "M -22 -18 C -14 -24, -8 -22, -4 -14 M -30 -4 C -38 -8, -44 -4, -46 4",
    "stroke-width": "1.8" }, sprig);
  [[-26, -12], [-36, 8], [-18, -26], [-40, 22]].forEach(([bx, by]) => {
    for (let k = 0; k < 7; k++) {
      const a = k / 7 * Math.PI * 2, r = k ? 4.2 + (k % 2) * 2 : 0;
      el("circle", { cx: bx + Math.cos(a) * r, cy: by + Math.sin(a) * r, r: 2.4,
        fill: "#e2558e", stroke: "#b8356a", "stroke-width": ".8" }, sprig);

  el("path", { d: "M 14 -34 L 14 8", stroke: "#222", "stroke-width": "2.2", "stroke-linecap": "round" }, parent);
  el("path", { d: "M 22 -30 L 22 4", stroke: PINK, "stroke-width": "1.8", "stroke-linecap": "round" }, parent);
  el("ellipse", { cx: 18, cy: 26, rx: 8, ry: 4.5, transform: "rotate(90 18 26)",
    stroke: "#c9a23c", "stroke-width": "1.4", fill: "none" }, parent);
  const dl = el("text", { transform: "translate(50 -6) rotate(90)", "text-anchor": "middle",
    "font-size": "14", "font-style": "italic", "font-family": serif, fill: "#161616" }, parent);
  dl.textContent = "Dolfin";
  el("circle", { cx: 74, cy: 36, r: 7, stroke: PINK, "stroke-width": "1.2", fill: "none" }, parent);
  el("circle", { cx: 74, cy: 36, r: 2, fill: PINK }, parent);
}
// the bar lying in the plane at (0,0) of `parent`: underside, then the
// raised top face. rot turns it within the plane.
function drawBar(parent, rot) {
  const { W, H, T } = BAR;
  const slab = el("g", { transform: `${PLANE} rotate(${rot})` }, parent);
  el("rect", { x: -W / 2, y: -H / 2, width: W, height: H, rx: 2, fill: "#d9aebd",
    stroke: CHOC_INK, "stroke-width": "4", "stroke-linejoin": "round" }, slab);
  const top = el("g", { transform: `translate(0 ${-T}) ${PLANE} rotate(${rot})` }, parent);
  barFace(top);
  return top;
}
// one strip of duct tape across the bar's short axis, long enough to be
// stuck to the table beyond the card at both ends: sampled in the bar's frame, projected to screen,
// lifted by the bar's thickness where it rides over the top and dropping
// straight down at the near edge
function chocTape(parent, rot) {
  const { W, H, T } = BAR;
  const cr = Math.cos(rot * Math.PI / 180), sr = Math.sin(rot * Math.PI / 180);
  const x0 = 36, x1 = 46, y0 = -H / 2 - 58, y1 = H / 2 + 130, w = 30;
  const lift = y => y < -H / 2 - 8 ? 0 : y < -H / 2 ? T * (y + H / 2 + 8) / 8 : y <= H / 2 ? T : 0;
  const proj = (x, y) => {
    const px = cr * x - sr * y, py = sr * x + cr * y;
    return [0.98 * px - 0.35 * py, 0.196 * px + 0.355 * py - lift(y)];
  };
  const N = 32, ys = [];
  for (let i = 0; i <= N; i++) ys.push(y0 + (y1 - y0) * i / N);
  ys.push(-H / 2 - 8, -H / 2, H / 2, H / 2 + 0.01);
  ys.sort((a, b) => a - b);
  const L = [], R = [], Tg = [];
  ys.forEach(y => {
    const x = x0 + (x1 - x0) * (y - y0) / (y1 - y0);
    L.push(proj(x - w / 2, y)); R.push(proj(x + w / 2, y));
  });
  for (let i = 0; i < L.length; i++) {
    const a = Math.max(0, i - 1), b = Math.min(L.length - 1, i + 1);
    const mx = (L[b][0] + R[b][0] - L[a][0] - R[a][0]) / 2;
    const my = (L[b][1] + R[b][1] - L[a][1] - R[a][1]) / 2;
    const len = Math.hypot(mx, my) || 1;
    Tg.push([mx / len, my / len]);
  }
  tapeBand(parent, L, R, Tg);
}
function drawChoc(outer) {
  outer.innerHTML = "";
  const root = el("g", { transform: `translate(${CHOC_AT.x} ${CHOC_AT.y})`,

}

/* ================= physics loop ================= */
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (cup.mode === "table") {
    if (cup.lift > 0 || cup.vLift !== 0) {
      cup.vLift -= GRAV * dt;
      cup.lift += cup.vLift * dt;
      if (cup.lift <= 0) {
        if (cup.vLift < -180) sndRattle(Math.min(1, -cup.vLift / 1400));
        cup.lift = 0; cup.vLift = 0;
      }
    }
    // wobble spring
    cup.vWob += (-70 * cup.wob - 6 * cup.vWob) * dt;
    cup.wob += cup.vWob * dt;
    // tip off the edge
    if (cupXY().x > EDGE_X && cup.lift === 0) startFall();
  } else if (cup.mode === "falling") {
    cup.fvy += GRAV * dt;
    cup.fx += cup.fvx * dt; cup.fy += cup.fvy * dt;
    cup.frot += cup.fvr * dt;
    if (cup.fy >= FLOOR_Y) shatter();
  }
  if (vase.on) {
    vase.vib *= Math.exp(-11 * dt);
    if (vase.vib < 0.15) vase.vib = 0;
    vase.vSway += (-90 * vase.sway - 5 * vase.vSway) * dt;
    vase.sway += vase.vSway * dt;
    renderVase();
  }
  renderCup();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function startFall() {
  const p = cupXY();
  cup.mode = "falling";
  cup.fx = p.x; cup.fy = p.y;
  cup.fvx = 140 + Math.random() * 160; cup.fvy = -40;
  cup.frot = 0; cup.fvr = 170 + Math.random() * 160;
}

/* ================= shatter ================= */
const fxG = $("fxG");
function shatter() {
  cup.mode = "broken";
  shatters += 1; dirty = true; save();
  if (CUP_KIND === "pink") { sndSparkle(); burstHearts(cup.fx, FLOOR_Y, true); }
  else if (CUP_KIND === "green") { sndStrum(); burstPicks(cup.fx, FLOOR_Y, true); }
  else { sndCrash(); drawWreck(cup.fx, FLOOR_Y, true); }
}
// the green cup breaks into oversized pearly guitar picks from Tokyo

const PICK = "M -20 -14 C -20 -26, 20 -26, 20 -14 C 20 2, 8 18, 0 24 C -8 18, -20 2, -20 -14 Z";

  }
}
const HEART = "M 0 5 C -1 2, -4 0, -7 0 C -11 0, -13 3, -13 6 C -13 11, -7 15, 0 20 C 7 15, 13 11, 13 6 C 13 3, 11 0, 7 0 C 4 0, 1 2, 0 5 Z";
// Animate the SVG transform ATTRIBUTE directly (rAF), like the cup does.
// CSS/WAAPI transforms on SVG children have different origin/parsing
// semantics than the attribute, which made effects "jump" when they ended.
function setT(elm, x, y, r, s) {
  elm.setAttribute("transform", `translate(${x} ${y}) rotate(${r}) scale(${s})`);
}
function tweenT(elm, from, to, dur) {
  const t0 = performance.now();
  (function fr(now) {
    const u = Math.min(1, (now - t0) / dur);
    const v = 1 - Math.pow(1 - u, 3); // easeOutCubic
    setT(elm,
      from.x + (to.x - from.x) * v, from.y + (to.y - from.y) * v,
      from.r + (to.r - from.r) * v, from.s + (to.s - from.s) * v);
    if (u < 1) requestAnimationFrame(fr);
  })(t0);
}
// quadratic-bezier flight (for hearts hopping out of the impact)
function flyT(elm, p0, pc, p1, rot, s0, s1, dur) {
  const t0 = performance.now();
  (function fr(now) {
    const u = Math.min(1, (now - t0) / dur), w = 1 - u;
    setT(elm,
      w * w * p0.x + 2 * w * u * pc.x + u * u * p1.x,
      w * w * p0.y + 2 * w * u * pc.y + u * u * p1.y,
      rot * u, s0 + (s1 - s0) * u);
    if (u < 1) requestAnimationFrame(fr);
  })(t0);
}
// sample a point in the perspective floor disc (same projection as shards)
function floorDisc(R) {
  const th = Math.random() * Math.PI * 2;
  const rr = R * Math.sqrt(Math.random());
  return {
    dx: 0.98 * rr * Math.cos(th) - 0.35 * rr * Math.sin(th),
    dy: 0.196 * rr * Math.cos(th) + 0.355 * rr * Math.sin(th),
  };
}
function burstHearts(cx, cy, animate) {
  fxG.innerHTML = "";
  const pinks = ["#f78fb0", "#fba7c0", "#ef7aa2", "#f95f96"];
  for (let i = 0; i < 30; i++) {
    const p = floorDisc(170);
    const x1 = cx + p.dx, y1 = cy - 14 + p.dy;         // where this heart settles (and stays)
    const sc = 0.6 + Math.random() * 1.3;
    const rot = (Math.random() - 0.5) * 90;
    const h = el("path", { d: HEART, fill: pinks[i % pinks.length],
      stroke: "#e06a92", "stroke-width": "3", "stroke-linejoin": "round",
      transform: `translate(${x1} ${y1}) rotate(${rot}) scale(${sc})` }, fxG);
    // hop out of the impact point in a little arc, then rest exactly there
    if (animate) flyT(h,
      { x: cx, y: cy - 40 },
      { x: (cx + x1) / 2, y: Math.min(cy, y1) - 120 - Math.random() * 90 },
      { x: x1, y: y1 },
      rot, sc * 0.5, sc, 550 + Math.random() * 450);
  }
}
function drawWreck(cx, cy, animate) {
  fxG.innerHTML = "";
  el("ellipse", { cx: 0, cy: 0, rx: 95, ry: 28, fill: "#7cc4ee", "fill-opacity": ".35",
    transform: `translate(${cx} ${cy + 8}) rotate(11)` }, fxG);
  const shapes = [
    "M 0 0 L 26 -34 L 38 -4 Z", "M 0 0 L -30 -26 L -12 -40 L -4 -6 Z",
    "M 0 0 L 18 -20 L 30 -22 L 12 -2 Z", "M 0 0 L -22 -14 L -34 -2 Z",
    "M 0 0 L 8 -26 L -6 -24 Z", "M 0 0 L 40 -12 L 46 -2 Z", "M 0 0 L -44 -8 L -50 0 Z",
  ];
  // Shards land inside a circle on the FLOOR PLANE, projected to screen:
  // lateral basis u = along the far edge (1, 0.2)-ish, depth basis v = along
  // the rim, foreshortened — a circle becomes a sheared ellipse.
  const R = 150;
  const N = 13;
  for (let i = 0; i < N; i++) {
    const d = shapes[i % shapes.length];
    const far = i % 4 === 3 ? 2.2 + Math.random() * 1.1 : 1; // some fly way out
    const th = Math.random() * Math.PI * 2;
    const rr = R * Math.sqrt(Math.random()) * far;
    const dx = 0.98 * rr * Math.cos(th) - 0.35 * rr * Math.sin(th);
    const dy = 0.196 * rr * Math.cos(th) + 0.355 * rr * Math.sin(th);
    const rot = (Math.random() - 0.5) * 110;
    const sc = 0.65 + Math.random() * 0.75;
    const s = el("path", { d, fill: "#79c4ef", "fill-opacity": ".5",
      stroke: "var(--blue-deep)", "stroke-width": "4", "stroke-linejoin": "round",
      transform: `translate(${cx + dx} ${cy + dy}) rotate(${rot}) scale(${sc})` }, fxG);
    if (animate) tweenT(s, { x: cx, y: cy - 30, r: 0, s: sc },
      { x: cx + dx, y: cy + dy, r: rot, s: sc },
      220 + Math.abs(dx) * 0.9 + i * 12);
  }
  if (animate) for (let i = 0; i < 7; i++) {
    const a = -Math.PI * (0.15 + 0.7 * Math.random());
    const v = 220 + Math.random() * 240, r = 3 + Math.random() * 4.5;
    const d = el("circle", { cx: 0, cy: 0, r, fill: "var(--blue)" }, fxG);
    const vx = Math.cos(a) * v * (Math.random() < 0.5 ? 1 : -1), vy = Math.sin(a) * v;
    const t0 = performance.now();
    (function fr(now) {
      const u = Math.min(1, (now - t0) / 460);
      d.setAttribute("transform",
        `translate(${cx + vx * 0.35 * u} ${cy - 8 + (vy * 0.35 + 145) * u * u})`);
      d.setAttribute("opacity", String(1 - u));
      if (u < 1) requestAnimationFrame(fr); else d.remove();
    })(t0);
  }
}

/* ================= bap! ================= */
const pawEls = [$("pawL"), $("pawR")];
let pawTurn = 0, mouthTimer = 0;
const tableSvg = $("tableAndCup"), cupSvg = $("cupfx"), headEl = $("head");

function bap() {
  const I = 0.15 + 0.85 * Math.pow(Math.random(), 1.6); // mostly gentle, sometimes THWACK
  baps += 1; dirty = true;
  sndThump(I);

  // paws — sprite frame down + drawn slam paw over the table edge
  // (paw-right.png slams on the screen-left side and vice versa)
  const slamFor = p => $(p.id === "pawR" ? "slamL" : "slamR");
  const both = I > 0.8;
  const paws = both ? pawEls : [pawEls[pawTurn ^= 1]];
  paws.forEach(p => { p.classList.add("down"); slamFor(p).classList.remove("hidden"); });
  setTimeout(() => paws.forEach(p => {
    p.classList.remove("down"); slamFor(p).classList.add("hidden");
  }), 90 + I * 60);
  if (I > 0.7) {
    $("mouth").classList.add("down");
    clearTimeout(mouthTimer);
    mouthTimer = setTimeout(() => $("mouth").classList.remove("down"), 300);
  }
  headEl.animate(
    [{ transform: "translateY(0)" }, { transform: `translateY(${2 + 4 * I}px)` }, { transform: "translateY(0)" }],
    { duration: 130, easing: "ease-out" });

  // table shake (cup layer shakes with it)
  const A = 1.5 + 11 * I;
  for (const el of [tableSvg, cupSvg]) el.animate([
    { transform: "translate(0,0) rotate(0deg)" },
    { transform: `translate(${-A * 0.4}px, ${A}px) rotate(${-0.12 * I}deg)` },
    { transform: `translate(${A * 0.3}px, ${-A * 0.6}px)` },
    { transform: `translate(${-A * 0.15}px, ${A * 0.35}px)` },
    { transform: "translate(0,0) rotate(0deg)" },
  ], { duration: 230 + I * 120, easing: "ease-out" });

  // the taped vase can't go anywhere — it buzzes, and the stems whip
  if (vase.on) {
    vase.vib = 2.5 + 8 * I;
    vase.vSway += (Math.random() < 0.5 ? -1 : 1) * (40 + 260 * I);
  }

  // cup response — the table can only push a cup it's touching
  if (cup.mode === "table") {
    if (cup.lift === 0) {
      cup.vLift = 120 + 820 * I * (0.6 + 0.4 * Math.random());
      cup.vWob += (Math.random() < 0.5 ? -1 : 1) * (30 + 260 * I);
      if (I > 0.32) {
        const dx = Math.pow(I, 1.7) * (26 + 44 * Math.random());
        cup.t = cup.t + dx / (TAB.x1 - TAB.x0);
      }
      save();
    } else if (cup.lift < CATCH && cup.vLift < 0) {
      // resonant catch: the rising table meets the falling cup and the
      // energies superimpose — bigger, more chaotic bounce
      cup.vLift = Math.min(1500, -cup.vLift * 1.15 + 250 + 900 * I);
      cup.vWob += (Math.random() < 0.5 ? -1 : 1) * (120 + 420 * I);
      const dx = Math.pow(I, 1.4) * (10 + 60 * Math.random()) * (Math.random() < 0.25 ? -0.4 : 1);
      cup.t = cup.t + dx / (TAB.x1 - TAB.x0);
      sndRattle(0.6);
      save();
    }
    // otherwise the cup is midair — the bap can't reach it
  }
}

$("stage").addEventListener("pointerdown", () => bap());
addEventListener("keydown", e => {
  if (e.key === "Escape") closeCard();
  if (e.code === "Space" && !$("login").offsetParent && !cardEl.offsetParent) { e.preventDefault(); bap(); }
});

/* ================= sound (synthesized) ================= */
let ac = null;
function ctx() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); return ac; }
function sndThump(I) {
  try {
    const a = ctx(), t = a.currentTime, g = a.createGain();
    g.gain.setValueAtTime(0.25 * I * I + 0.04, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    const o = a.createOscillator();
    o.frequency.setValueAtTime(90 + 40 * I, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 0.14);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + 0.17);
  } catch (_) {}
}
function noiseBurst(dur, freq, q, gain) {
  const a = ctx(), t = a.currentTime;
  const n = a.createBufferSource(), buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
  n.buffer = buf;
  const f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
  const g = a.createGain(); g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  n.connect(f).connect(g).connect(a.destination);
  n.start(t);
}
function sndRattle(I) { try { noiseBurst(0.06, 2600, 8, 0.10 * I); } catch (_) {} }
function sndStrum() {
  try {
    const a = ctx(), t = a.currentTime;
    noiseBurst(0.08, 4000, 5, 0.12); // pick clatter
    [196, 247, 330, 392].forEach((f, i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = "triangle"; o.frequency.value = f;
      const t0 = t + 0.03 + i * 0.045;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.14, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.5);
      o.connect(g).connect(a.destination);
      o.start(t0); o.stop(t0 + 0.55);
    });
  } catch (_) {}
}
function sndSparkle() {
  try {
    const a = ctx(), t = a.currentTime;
    [880, 1175, 1568, 2093].forEach((f, i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i * 0.07);
      g.gain.exponentialRampToValueAtTime(0.11, t + i * 0.07 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.07 + 0.35);
      o.connect(g).connect(a.destination);
      o.start(t + i * 0.07); o.stop(t + i * 0.07 + 0.4);
    });
  } catch (_) {}
}
function sndCrash() {
  try {
    noiseBurst(0.5, 3200, 1.2, 0.30);
    setTimeout(() => noiseBurst(0.25, 4200, 6, 0.12), 70);
    setTimeout(() => noiseBurst(0.18, 5200, 8, 0.07), 160);
  } catch (_) {}
}

/* ================= persistence ================= */
let saveTimer = 0;
function stateBody() {
  return JSON.stringify({
    cup_x: Math.min(1, Math.max(0, cup.t)),
    baps, broken: cup.mode === "broken", shatters,
    burst: { blue: "glass", green: "picks", pink: "hearts" }[CUP_KIND],
    color: CUP_KIND,
  });
}
function save() {
  if (!user) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    dirty = false;
    const res = await fetch(`${API}/state`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: stateBody(),
    }).catch(() => null);
    if (res && res.status === 401) showLogin();
  }, 700);
}
addEventListener("pagehide", () => {
  if (user && dirty) {
    clearTimeout(saveTimer);
    fetch(`${API}/state`, {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: stateBody(), keepalive: true,
    }).catch(() => {});
  }
});

/* ================= auth ================= */
function reveal() { $("scene").style.visibility = "visible"; }
function showLogin() {
  user = null;
  reveal();
  $("login").classList.remove("hidden");
  $("lu").focus();
}
async function enter(me) {
  user = me;
  $("login").classList.add("hidden");
  // cup-owning test hooks own the scene; don't clear/redraw over them
  // (table dressing like ?test=flowers / ?test=choc still loads state)
  if (TEST && !DRESS_TESTS.includes(TEST)) { reveal(); return; }
  const res = await fetch(`${API}/state`).catch(() => null);
  if (res && res.ok) {
    const st = await res.json();
    baps = st.baps || 0; shatters = st.shatters || 0;
    // re-roll the cup color excluding the server-remembered last one,
    // and save the pick so the NEXT load excludes it in turn
    if (!CUP_KINDS.includes(qcup)) {
      const opts = CUP_KINDS.filter(k => k !== st.color);
      setCupKind(opts[Math.floor(Math.random() * opts.length)]);
      dirty = true; save();
    }
    fxG.innerHTML = "";
    cup.mode = "table";
    if (st.broken) {
      // a broken cup resets on refresh: fresh cup at home
      cup.t = 0;
      dirty = true; save();
    } else {
      cup.t = Math.min(1, Math.max(0, st.cup_x || 0));
    }
    renderCup();
  }
  reveal();
}
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("lmsg").textContent = "";
  const res = await fetch(`${AUTH}/login`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: $("lu").value.trim(), password: $("lp").value }),
  }).catch(() => null);
  if (!res || !res.ok) { $("lmsg").textContent = "nope."; return; }
  enter(await res.json());
});
// visual test hooks (harmless in prod; synchronous so screenshots are deterministic)
const TEST = new URLSearchParams(location.search).get("test");
const DRESS_TESTS = ["flowers", "choc"];
function applyTest() {
  if (TEST === "down") {
    $("pawL").classList.add("down"); $("pawR").classList.add("down"); $("mouth").classList.add("down");
    $("slamL").classList.remove("hidden"); $("slamR").classList.remove("hidden");
  }
  if (TEST === "mid") { cup.t = 0.75; }
  if (TEST === "broken") { cup.mode = "broken"; drawWreck(780, FLOOR_Y, false); }
  if (TEST === "hearts") { cup.mode = "broken"; burstHearts(780, FLOOR_Y, false); }
  if (TEST === "picks") { cup.mode = "broken"; burstPicks(780, FLOOR_Y, false); }
  const topts = TEST === "flowers" ? { ...TABLE_OPTS, vase: true, sorry: true }
              : TEST === "choc"    ? { ...TABLE_OPTS, choc: true } : TABLE_OPTS;
  if (topts.vase) { vase.on = true; drawVase(vaseG, topts); }
  if (topts.choc) drawChoc(chocG);
  if (TEST) renderCup();
}
applyTest();

(async function boot() {
  const res = await fetch(`${AUTH}/me`).catch(() => null);
  if (res && res.ok) await enter(await res.json());
  else showLogin();
})();
</script>
