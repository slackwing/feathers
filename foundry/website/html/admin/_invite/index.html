<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Choose a password</title>
<link rel="stylesheet" href="/admin/assets/style.css?v=3">
</head>
<body>
<!-- Default invite page: used for any website that has no _invite/ skin
     of its own. The machinery is /admin/assets/setpw.js. -->
<main>
  <section class="card narrow">
    <h1>Choose a password</h1>
    <form data-pw="form">
      <p class="msg err" data-pw="nocode" hidden>This page needs the link from your invitation email.</p>
      <label for="u">User</label>
      <input id="u" data-pw="username" autocomplete="username" readonly>
      <label for="p">Password</label>
      <input id="p" data-pw="password" type="password" autocomplete="new-password" minlength="8" required>
      <button class="primary" type="submit" data-pw="submit">Set password</button>
      <p class="msg err" data-pw="msg"></p>
    </form>
    <div data-pw="done" hidden>
      <p class="msg ok">Password set. You're logged in, <b data-pw="name"></b>.</p>
      <p><a data-pw="enter" href="/">Continue →</a></p>
    </div>
    <p class="msg err" data-pw="invalid" hidden>This link is invalid or has expired. Ask for a new one.</p>
  </section>
</main>
<script src="/admin/assets/setpw.js?v=1"></script>
<script>SetPassword.mount();</script>
</body>
</html>
