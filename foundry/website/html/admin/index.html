<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=2">
</head>
<body>
<main>

  <!-- login -->
  <section id="login" class="card narrow hidden">
    <h1 class="mono">▪ admin</h1>
    <form id="login-form">
      <label for="lu">User</label>
      <input id="lu" name="username" autocomplete="username" required>
      <label for="lp">Password</label>
      <input id="lp" name="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Log in</button>
      <div class="msg err" id="login-msg"></div>
    </form>
  </section>

  <!-- forbidden -->
  <section id="forbidden" class="card narrow hidden">
    <h1 class="mono">▪ admin</h1>
    <p style="margin-top:1rem">Not authorized.</p>
    <button class="primary" id="forbidden-logout">Log out</button>
  </section>

  <!-- console -->
  <section id="console" class="hidden">
    <header class="top">
      <h1>admin</h1>
      <span class="who"><span id="who-avatar"></span> <b id="who"></b> <button class="quiet" id="logout">Log out</button></span>
    </header>

    <h2>Users <span class="note" id="email-note"></span></h2>
    <table>
      <thead>
        <tr><th></th><th>User</th><th>Display name</th><th>Email</th><th>Roles</th><th>Links · Email</th><th></th></tr>
      </thead>
      <tbody id="users"></tbody>
    </table>

    <h2>New user</h2>
    <div class="card">
      <form id="create-form" class="inline">
        <span class="avatar" id="new-avatar">?</span>
        <input id="cu" placeholder="username" autocomplete="off" required>
        <input id="cd" placeholder="display name" autocomplete="off" required>
        <input id="ci" placeholder="initial" maxlength="3" autocomplete="off" class="short" title="1–3 characters shown in the avatar">
        <input id="cc" type="color" title="avatar color (random to start)">
        <input id="ce" placeholder="email (optional)" type="email" autocomplete="off">
        <button type="submit">Create</button>
      </form>
      <div class="msg err" id="create-msg"></div>
    </div>

    <div id="linkout" class="linkout hidden">
      <span id="link-url" class="mono"></span>
      <span class="exp" id="link-exp"></span>
      <button class="quiet" id="link-copy" style="margin-top:.5rem">Copy</button>
    </div>
    <div class="msg" id="console-msg"></div>
  </section>

</main>

<dialog id="edit">
  <form id="edit-form" method="dialog">
    <h3 class="mono">▪ edit <span id="edit-user"></span></h3>
    <div class="inline" style="margin-top:1rem">
      <span class="avatar" id="edit-avatar">?</span>
      <input id="ed" placeholder="display name" required>
      <input id="ei" placeholder="initial" maxlength="3" class="short">
      <input id="ec" type="color">
    </div>
    <input id="ee" placeholder="email (optional)" type="email" style="margin-top:.6rem">
    <div class="inline" style="margin-top:1.2rem;justify-content:flex-end">
      <button class="quiet" type="button" id="edit-cancel">Cancel</button>
      <button type="submit">Save</button>
    </div>
    <div class="msg err" id="edit-msg"></div>
  </form>
</dialog>

<script>
const API = "/admin/api";
let websites = [];   // [{website, roles:[...]}]
let me = null;
let emailConfigured = false;
const tplCache = {};  // website -> [{id, name, subject, invite, on}]

const $ = id => document.getElementById(id);
const show = id => {
  ["login", "forbidden", "console"].forEach(s => $(s).classList.toggle("hidden", s !== id));
};

async function api(path, opts = {}) {
  if (opts.body) opts.headers = { "Content-Type": "application/json", ...opts.headers };
  const res = await fetch(API + path, opts);
  if (!res.ok) throw Object.assign(new Error(await res.text()), { status: res.status });
  return res.status === 204 ? null : res.json();
}

const isAdmin = m => m.roles.some(r => r.website === "admin" && r.role === "admin");

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---- avatar helpers (same rules as rv's admin chips + the server) ----
function textColor(hex) {
  if (!/^#[0-9a-f]{6}$/i.test(hex)) return "#fff";
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 170 ? "#1c2a25" : "#fff";
}
// Random hue, fixed saturation/lightness — mirrors shared.RandomColor.
function randomColor() {
  const h = Math.floor(Math.random() * 360), s = 0.55, l = 0.45;
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  return "#" + [r, g, b].map(v => Math.round((v + m) * 255).toString(16).padStart(2, "0")).join("");
}
const defaultInitial = name => (name.trim()[0] || "?").toUpperCase();
function paintAvatar(el, initial, color) {
  el.textContent = initial || "?";
  el.style.background = color;
  el.style.color = textColor(color);
}
const avatarHTML = u => `<span class="avatar" style="background:${esc(u.color)};color:${textColor(u.color)}">${esc(u.initial)}</span>`;

async function templatesFor(site) {
  if (site in tplCache) return tplCache[site];
  try {
    const r = await fetch(`/${site}/_email/templates.json`, { cache: "no-cache" });
    tplCache[site] = r.ok ? ((await r.json()).templates || []) : [];
  } catch { tplCache[site] = []; }
  return tplCache[site];
}

async function boot() {
  try {
    me = await api("/me");
  } catch {
    show("login");
    return;
  }
  if (!isAdmin(me)) { show("forbidden"); return; }
  $("who").textContent = me.display_name;
  $("who-avatar").innerHTML = avatarHTML(me);
  show("console");
  try {
    const st = await api("/email-status");
    emailConfigured = !!st.configured;
    $("email-note").textContent = emailConfigured ? `email from ${st.from}` : "email not configured (hobby-server config.yaml → email:)";
  } catch { emailConfigured = false; }
  await refresh();
}

async function refresh() {
  websites = await api("/websites");
  renderUsers(await api("/users"));
}

function renderUsers(users) {
  const tbody = $("users");
  tbody.innerHTML = "";
  for (const u of users) {
    const tr = document.createElement("tr");

    const roleChips = u.roles.map(r =>
      `<span class="chip"><span class="site">${esc(r.website)}/</span>${esc(r.role)}<span class="x" data-act="rmrole" data-w="${esc(r.website)}" data-r="${esc(r.role)}">✕</span></span>`
    ).join("");

    const siteOpts = websites.filter(w => w.roles.length)
      .map(w => `<option value="${esc(w.website)}">${esc(w.website)}</option>`).join("");
    const userSites = new Set(u.roles.map(r => r.website));
    const inviteOpts = websites.filter(w => userSites.has(w.website))
      .map(w => `<option value="${esc(w.website)}">${esc(w.website)}</option>`).join("");
    const inviteCtl = inviteOpts
      ? `<select data-act="invite-site">${inviteOpts}</select>
          <button class="quiet" data-act="invite" title="copy an invite link">Link</button>
          <select data-act="mail-tpl" class="hidden"></select>
          <button class="quiet hidden" data-act="mail">Send</button>`
      : "";

    tr.innerHTML = `
      <td><span class="dot ${u.has_password ? "set" : "unset"}" title="${u.has_password ? "password set" : "password unset"}"></span> ${avatarHTML(u)}</td>
      <td class="mono">${esc(u.username)}</td>
      <td>${esc(u.display_name)}</td>
      <td class="mono dim">${esc(u.email || "")}</td>
      <td>
        ${roleChips}
        <span class="inline">
          <select data-act="role-site">${siteOpts}</select>
          <select data-act="role-role"></select>
          <button class="quiet" data-act="addrole">Add</button>
        </span>
      </td>
      <td>
        <span class="inline">
          <button class="quiet" data-act="reset" title="copy a password-reset link">Reset</button>
          ${inviteCtl}
        </span>
      </td>
      <td class="nowrap">
        <button class="quiet" data-act="edit" title="edit profile">✎</button>
        ${u.username === me.username ? "" : `<button class="quiet" data-act="del" title="delete user">Delete</button>`}
      </td>`;

    const siteSel = tr.querySelector('[data-act="role-site"]');
    const roleSel = tr.querySelector('[data-act="role-role"]');
    const fillRoles = () => {
      const w = websites.find(x => x.website === siteSel.value);
      roleSel.innerHTML = (w ? w.roles : []).map(r => `<option>${esc(r)}</option>`).join("");
    };
    siteSel.addEventListener("change", fillRoles);
    fillRoles();

    // Email templates follow the selected invite site; the Send button
    // only appears when the site ships an _email/ manifest.
    const invSel = tr.querySelector('[data-act="invite-site"]');
    const tplSel = tr.querySelector('[data-act="mail-tpl"]');
    const mailBtn = tr.querySelector('[data-act="mail"]');
    const fillTpls = async () => {
      const tpls = await templatesFor(invSel.value);
      tplSel.innerHTML = tpls.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("");
      const on = tpls.length > 0;
      tplSel.classList.toggle("hidden", !on);
      mailBtn.classList.toggle("hidden", !on);
      mailBtn.disabled = !emailConfigured || !u.email;
      mailBtn.title = !emailConfigured ? "email not configured on the server" : (!u.email ? "user has no email" : `email ${u.email}`);
    };
    if (invSel) { invSel.addEventListener("change", fillTpls); fillTpls(); }

    tr.addEventListener("click", async e => {
      const act = e.target.dataset.act;
      try {
        if (act === "rmrole") {
          await api("/roles", { method: "DELETE", body: JSON.stringify({ username: u.username, website: e.target.dataset.w, role: e.target.dataset.r }) });
          await refresh();
        } else if (act === "addrole") {
          await api("/roles", { method: "POST", body: JSON.stringify({ username: u.username, website: siteSel.value, role: roleSel.value }) });
          await refresh();
        } else if (act === "edit") {
          openEdit(u);
        } else if (act === "del") {
          if (confirm(`Delete ${u.username}? Roles, sessions, and pending links go with it.`)) {
            await api(`/users/${encodeURIComponent(u.username)}`, { method: "DELETE" });
            await refresh();
          }
        } else if (act === "reset") {
          showLink(await api("/links", { method: "POST", body: JSON.stringify({ username: u.username, type: "reset" }) }));
        } else if (act === "invite") {
          showLink(await api("/links", { method: "POST", body: JSON.stringify({ username: u.username, type: "invite", website: invSel.value }) }));
        } else if (act === "mail") {
          mailBtn.disabled = true;
          const r = await api("/email", { method: "POST", body: JSON.stringify({ username: u.username, website: invSel.value, template: tplSel.value }) });
          mailBtn.disabled = false;
          flash(`sent "${r.subject}" to ${r.to}`, false);
          if (r.invite_url) showLink({ url: r.invite_url, expires_at: r.expires_at });
        }
      } catch (err) {
        mailBtn && (mailBtn.disabled = false);
        flash(err.message || "error", true);
      }
    });

    tbody.appendChild(tr);
  }
}

function showLink({ url, expires_at }) {
  $("link-url").textContent = url;
  $("link-exp").textContent = "expires " + new Date(expires_at).toLocaleString();
  $("linkout").classList.remove("hidden");
}

let flashTimer;
function flash(text, isErr) {
  const m = $("console-msg");
  m.textContent = text;
  m.className = "msg " + (isErr ? "err" : "ok");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { m.textContent = ""; }, 5000);
}

$("link-copy").addEventListener("click", async () => {
  await navigator.clipboard.writeText($("link-url").textContent);
  flash("copied", false);
});

$("login-form").addEventListener("submit", async e => {
  e.preventDefault();
  $("login-msg").textContent = "";
  try {
    me = await api("/login", { method: "POST", body: JSON.stringify({ username: $("lu").value.trim(), password: $("lp").value }) });
  } catch (err) {
    $("login-msg").textContent = err.status === 401 ? "Invalid credentials." : (err.message || "error");
    return;
  }
  boot();
});

// ---- create ----
let initialTouched = false;
function resetCreate() {
  ["cu", "cd", "ci", "ce"].forEach(id => { $(id).value = ""; });
  $("cc").value = randomColor();
  initialTouched = false;
  paintAvatar($("new-avatar"), "?", $("cc").value);
}
$("cd").addEventListener("input", () => {
  if (!initialTouched) $("ci").value = $("cd").value.trim() ? defaultInitial($("cd").value) : "";
  paintAvatar($("new-avatar"), $("ci").value || "?", $("cc").value);
});
$("ci").addEventListener("input", () => { initialTouched = $("ci").value !== ""; paintAvatar($("new-avatar"), $("ci").value || "?", $("cc").value); });
$("cc").addEventListener("input", () => paintAvatar($("new-avatar"), $("ci").value || "?", $("cc").value));
$("create-form").addEventListener("submit", async e => {
  e.preventDefault();
  $("create-msg").textContent = "";
  try {
    await api("/users", { method: "POST", body: JSON.stringify({
      username: $("cu").value.trim(), display_name: $("cd").value.trim(),
      initial: $("ci").value.trim() || defaultInitial($("cd").value),
      color: $("cc").value, email: $("ce").value.trim(),
    }) });
    resetCreate();
    await refresh();
  } catch (err) {
    $("create-msg").textContent = err.message || "error";
  }
});
resetCreate();

// ---- edit dialog ----
let editing = null;
function openEdit(u) {
  editing = u;
  $("edit-user").textContent = u.username;
  $("ed").value = u.display_name; $("ei").value = u.initial; $("ec").value = u.color; $("ee").value = u.email || "";
  $("edit-msg").textContent = "";
  paintAvatar($("edit-avatar"), u.initial, u.color);
  $("edit").showModal();
}
["ei", "ec"].forEach(id => $(id).addEventListener("input", () => paintAvatar($("edit-avatar"), $("ei").value || "?", $("ec").value)));
$("edit-cancel").addEventListener("click", () => $("edit").close());
$("edit-form").addEventListener("submit", async e => {
  e.preventDefault();
  try {
    await api(`/users/${encodeURIComponent(editing.username)}`, { method: "PATCH", body: JSON.stringify({
      display_name: $("ed").value.trim(), initial: $("ei").value.trim(), color: $("ec").value, email: $("ee").value.trim(),
    }) });
    $("edit").close();
    if (editing.username === me.username) me = await api("/me"), $("who").textContent = me.display_name, $("who-avatar").innerHTML = avatarHTML(me);
    await refresh();
  } catch (err) {
    $("edit-msg").textContent = err.message || "error";
  }
});

const doLogout = async () => { await api("/logout", { method: "POST" }); show("login"); };
$("logout").addEventListener("click", doLogout);
$("forbidden-logout").addEventListener("click", doLogout);

boot();
</script>
</body>
</html>
