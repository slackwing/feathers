<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hunter × Halloween — Summons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="retro.css?v=1">
<style>
  .body { text-align: center; }
  form, #done, #invalid { text-align: left; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="desktop center" id="desktop">
  <div class="win static" id="win-invite" data-title="Hunter Website — Accept summons" data-icon="envelope" data-noclose data-notask data-width="400">
    <div class="body">
      <div class="assoc">Hunter Association · Official Summons</div>
      <h1 class="logo">You Are<br>Chosen <span class="x">×</span></h1>

      <form id="form" class="hidden">
        <p>The committee has cleared you for the Halloween Phase.
        Set your passphrase, applicant.</p>
        <label class="lbl" for="u">Applicant</label>
        <input class="field" id="u" name="username" autocomplete="username" readonly>
        <label class="lbl" for="p">Passphrase</label>
        <input class="field" id="p" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <div class="actions"><button class="btn primary wide" type="submit">Accept summons</button></div>
        <div class="msg err" id="msg"></div>
      </form>

      <div id="done" class="hidden">
        <p class="ok">Welcome, <span id="dn"></span>. Your license is in order.</p>
        <div class="actions"><a class="btn primary" href="/hxh/">Enter the exam site</a></div>
      </div>

      <p id="invalid" class="err hidden">
        This summons is void or expired. Reach out to the hosts for a fresh one.
      </p>
    </div>
  </div>
</div>
<div class="taskbar" id="taskbar"></div>

<script src="retro.js?v=1"></script>
<script>
Retro.init();
const API = "/admin/api";
const $ = id => document.getElementById(id);
const code = new URLSearchParams(location.search).get("code") || "";

async function boot() {
  if (!code) { $("invalid").classList.remove("hidden"); return; }
  const res = await fetch(`${API}/token-info?code=${encodeURIComponent(code)}`);
  if (!res.ok) { $("invalid").classList.remove("hidden"); return; }
  const info = await res.json();
  $("u").value = info.username;
  $("form").classList.remove("hidden");
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("msg").textContent = "";
  const res = await fetch(`${API}/set-password`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code, password: $("p").value }),
  });
  if (!res.ok) {
    $("msg").textContent = res.status === 404 ? "This summons is void or expired." : await res.text();
    return;
  }
  const me = await res.json();
  $("form").classList.add("hidden");
  $("dn").textContent = me.display_name;
  $("done").classList.remove("hidden");
});

boot();
</script>
</body>
</html>
