<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Roster DB</title>
<!-- Plain admin look on purpose (the administrative base stylesheet), not
     the site theme: this is a curation tool, not part of the Hunter Website. -->
<link rel="stylesheet" href="/admin/assets/style.css?v=4">
<link rel="stylesheet" href="roster.css?v=1">
</head>
<body>
<main>
  <header class="top">
    <h1><a href="#/" id="home">Roster DB</a><span id="crumb"></span></h1>
    <span class="who"><b id="me"></b><a href="/hxh/">site</a> · <a href="/admin/">admin</a> · <a href="#" id="logout">log out</a></span>
  </header>

  <p id="status" class="msg"></p>

  <section id="login" class="card narrow hidden">
    <h1>Roster DB</h1>
    <form id="login-form">
      <label for="lu">Username</label><input id="lu" autocomplete="username" required>
      <label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Log in</button>
      <p class="msg err" id="login-msg"></p>
    </form>
  </section>

  <section id="list" class="hidden">
    <div class="bar">
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>#</th><th></th><th>Name</th><th>Japanese</th><th>Rank</th><th>Nen</th><th>Affiliation</th><th>Images</th><th>Status</th><th>Updated</th></tr></thead>
      <tbody id="rows"></tbody>
      <tfoot><tr>
        <td colspan="2"></td>
        <td colspan="2"><form id="new-form" class="newrow"><input id="new-slug" placeholder="slug" pattern="[a-z0-9]+(-[a-z0-9]+)*" required><input id="new-name" placeholder="Name" required><button type="submit">Add</button></form></td>
        <td colspan="6"></td>
      </tr></tfoot>
    </table></div>
  </section>

  <section id="profile" class="hidden">
    <div class="head">
      <div class="slots">
        <div class="slot avatar" data-slot="avatar_image_id" title="Avatar"></div>
        <div class="slot card2" data-slot="card_image_id" title="Card"></div>
      </div>
      <div class="ident">
        <div class="line1"><span class="num" id="p-id"></span><span class="name" id="p-name"></span><span class="kebab-wrap"><button class="kebab" id="p-menu" title="More">⋯</button></span></div>
        <div class="line2 dim" id="p-sub"></div>
        <div class="seg" id="p-status"></div>
      </div>
    </div>

    <div class="fields" id="fields"></div>

    <div id="gallery"></div>
  </section>
</main>

<div id="selbar" class="selbar hidden">
  <span class="info" id="sel-info"></span>
  <span class="grow"></span>
  <button data-do="avatar">Avatar</button>
  <button data-do="card">Card</button>
  <button data-do="crop">Crop</button>
  <button data-do="open">Open</button>
  <button data-do="reject">Reject</button>
  <button data-do="delete" class="danger">Delete</button>
</div>
<input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>

<script src="roster.js?v=1"></script>
</body>
</html>
