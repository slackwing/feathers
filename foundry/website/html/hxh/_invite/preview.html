<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>hxh invite page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<!-- Plain admin-console look, same as _email/index.html: the framed page
     is the thing being previewed, not this page. -->
<link rel="stylesheet" href="/admin/assets/style.css?v=2">
<style>
  .tabs { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1rem 0; }
  .tabs button.on { background: var(--accent); color: var(--bg); }
  .meta { display: flex; flex-wrap: wrap; gap: .6rem 1.5rem; align-items: baseline; color: var(--dim); font-size: .85rem; margin-bottom: .8rem; }
  .meta b { color: var(--text); font-weight: 500; }
  .frame { border: 1px solid var(--line); background: #0b0a08; position: relative; }
  .frame iframe { display: block; width: 100%; height: 720px; border: 0; pointer-events: none; }
  .frame::after {
    content: "preview — inert"; position: absolute; top: .5rem; right: .5rem;
    background: var(--panel); color: var(--dim); border: 1px solid var(--line);
    padding: .15rem .5rem; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>hxh invite page</h1>
    <span class="who"><a href="/hxh/">site</a> · <a href="/admin/">console</a> · <a href="/hxh/_email/">emails</a></span>
  </header>

  <p id="status" class="msg">…</p>

  <section id="view" class="hidden">
    <div class="tabs" id="tabs"></div>
    <div class="meta">
      <span>state <b id="tname"></b></span>
      <span>url <b id="turl"></b></span>
      <span id="tnote"></span>
    </div>
    <div class="frame"><iframe id="frame" title="Invite page preview"></iframe></div>
  </section>
</main>

<script>
const AUTH = "/admin/api";
const $ = id => document.getElementById(id);
const STATES = [
  { id: "invite", name: "Invited", note: "what an invitee sees from an emailed or copied link (boot plays first on the real page)" },
  { id: "change", name: "Logged in", note: "the page opened with no code while logged in — changes your own password" },
  { id: "void",   name: "Void link", note: "expired, used, or unknown code" },
];
function show(s) {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.id === s.id));
  $("tname").textContent = s.name;
  $("turl").textContent = s.id === "invite" ? "/hxh/_invite/?code=…" : "/hxh/_invite/";
  $("tnote").textContent = s.note;
  $("frame").src = `./?preview=${s.id}`;
}
async function boot() {
  const res = await fetch(AUTH + "/me");
  if (!res.ok) { $("status").innerHTML = 'Not logged in. <a href="/hxh/">Log in first</a>.'; return; }
  const me = await res.json();
  if (!(me.roles || []).some(r => r.website === "hxh" && r.role === "admin")) { $("status").textContent = "Not authorized."; return; }
  for (const s of STATES) {
    const b = document.createElement("button");
    b.dataset.id = s.id; b.textContent = s.name;
    b.addEventListener("click", () => show(s));
    $("tabs").append(b);
  }
  $("status").classList.add("hidden");
  $("view").classList.remove("hidden");
  show(STATES[0]);
}
boot();
</script>
</body>
</html>
