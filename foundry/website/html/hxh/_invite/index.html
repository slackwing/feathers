<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hunter × Halloween</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../retro.css?v=10">
<style>
  /* Logon dialog: boots, then sits alone on the desktop — no taskbar. */
  .desktop.center { min-height: 100svh; padding-bottom: 16px; }
  .h { font: 16px/1.5 var(--font-px); text-align: center; margin: 8px 0 6px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas class="wall" id="wall" width="320" height="180"></canvas>
<div class="desktop center" id="desktop">
  <div class="win static" id="win-invite" data-title="Hunter × Halloween" data-icon="x" data-noclose data-notask data-width="400" hidden>
    <div class="body">
      <h1 class="h" id="h">Choose a password</h1>

      <form id="form" class="hidden">
        <label class="lbl" for="u">Applicant</label>
        <input class="field" id="u" name="username" autocomplete="username" readonly>
        <label class="lbl" for="p">Password</label>
        <input class="field" id="p" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <div class="actions"><button class="btn primary wide" type="submit" id="submit">Accept summons</button></div>
        <div class="msg err" id="msg"></div>
      </form>

      <div id="done" class="hidden">
        <p class="ok" id="done-msg"></p>
        <div class="actions"><a class="btn primary" href="/hxh/">Enter the exam site</a></div>
      </div>

      <p id="invalid" class="err hidden">
        This summons is void or expired. Reach out to the hosts for a fresh one.
      </p>
    </div>
  </div>
</div>

<script src="../retro.js?v=10"></script>
<script>
Retro.init();
Retro.wallpaper(document.getElementById("wall"));
const API = "/admin/api";
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const code = params.get("code") || "";
const preview = params.get("preview");   // invite | change | void — for _invite/preview.html
let mode = "invite";

// Which state to show: an invite (code in URL), a password change (no
// code, logged in), or a void link.
async function decide() {
  if (preview === "invite") return { mode: "invite", username: "abi" };
  if (preview === "void") return { mode: "void" };
  if (preview === "change") {
    const r = await fetch(`${API}/me`).catch(() => null);
    return { mode: "change", username: r && r.ok ? (await r.json()).username : "andrew" };
  }
  if (code) {
    const r = await fetch(`${API}/token-info?code=${encodeURIComponent(code)}`);
    return r.ok ? { mode: "invite", username: (await r.json()).username } : { mode: "void" };
  }
  const r = await fetch(`${API}/me`);
  return r.ok ? { mode: "change", username: (await r.json()).username } : { mode: "void" };
}

function render(state) {
  mode = state.mode;
  if (mode === "void") { $("h").classList.add("hidden"); $("invalid").classList.remove("hidden"); return; }
  $("u").value = state.username;
  if (mode === "change") $("submit").textContent = "Change password";
  $("form").classList.remove("hidden");
}

async function start() {
  const pending = decide();
  if (!preview) {
    await Retro.boot({
      badge: `<div>a purple square<br>production</div>${Retro.icon("tee", 54)}`,
      lines: [
        { text: "HunterOS 99 · Hunter Association Network", pause: 120 },
        { text: "> connecting to hunter.net .........", ok: true, wait: 120 },
        { text: "> starting logon ...................", ok: true, wait: 160 },
      ],
      speed: 5, tail: 250,
    });
  }
  render(await pending);
  await Retro.open("win-invite", null, { scroll: false, jank: !preview });
  if (mode !== "void") $("p").focus();
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if (preview) return;
  $("msg").textContent = "";
  const password = $("p").value;
  const res = mode === "invite"
    ? await fetch(`${API}/set-password`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code, password }) })
    : await fetch(`${API}/password`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password }) });
  if (!res.ok) {
    $("msg").textContent = res.status === 404 ? "This summons is void or expired." : await res.text();
    return;
  }
  $("form").classList.add("hidden");
  $("done-msg").textContent = mode === "invite"
    ? `Welcome, ${(await res.json()).display_name}. Your license is in order.`
    : "Password changed.";
  $("done").classList.remove("hidden");
});

start();
</script>
</body>
</html>
