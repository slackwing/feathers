<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>hxh email templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<!-- Deliberately the plain admin-console look, NOT the site theme, so the
     themed email inside the preview frame is unmistakably the email. -->
<link rel="stylesheet" href="/admin/assets/style.css?v=2">
<style>
  .tabs { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1rem 0; }
  .tabs button.on { background: var(--accent); color: var(--bg); }
  .meta { display: flex; flex-wrap: wrap; gap: .6rem 1.5rem; align-items: baseline; color: var(--dim); font-size: .85rem; margin-bottom: .8rem; }
  .meta b { color: var(--text); font-weight: 500; }
  .frame { border: 1px solid var(--line); background: #fff; position: relative; }
  .frame iframe { display: block; width: 100%; height: 760px; border: 0; pointer-events: none; }
  .frame::after {
    content: "preview — links are inert"; position: absolute; top: .5rem; right: .5rem;
    background: var(--panel); color: var(--dim); border: 1px solid var(--line);
    padding: .15rem .5rem; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase;
  }
  .actions { display: flex; gap: .6rem; align-items: center; margin-top: 1rem; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>hxh email templates</h1>
    <span class="who"><a href="/hxh/">site</a> · <a href="/admin/">console</a> · <a href="/hxh/_invite/preview.html">invite page</a></span>
  </header>

  <p id="status" class="msg">…</p>

  <section id="view" class="hidden">
    <div class="tabs" id="tabs"></div>
    <div class="meta">
      <span>template <b id="tid"></b></span>
      <span>subject <b id="subject"></b></span>
      <span>to <b id="to"></b></span>
      <span id="note"></span>
    </div>
    <div class="frame"><iframe id="frame" title="Email preview" sandbox=""></iframe></div>
    <div class="actions">
      <button id="send" class="quiet">Send test to me</button>
      <span class="msg" id="msg" style="margin:0"></span>
    </div>
  </section>
</main>

<script>
const AUTH = "/admin/api";
const SITE = "hxh";
const $ = id => document.getElementById(id);
let me = null, manifest = null, current = null;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function textColor(hex) {
  if (!/^#[0-9a-f]{6}$/i.test(hex || "")) return "#fff6e0";
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 170 ? "#0b0a08" : "#fff6e0";
}

// Same variable set the server substitutes (hobby-server
// internal/shared/email.go), filled with the logged-in admin's account.
function sampleVars() {
  const base = location.origin;
  const exp = new Date(Date.now() + 7 * 86400e3);
  return {
    display_name: me.display_name, username: me.username, initial: me.initial,
    color: me.color, color_text: textColor(me.color),
    email: me.email || "", website: SITE,
    site_url: `${base}/${SITE}/`, base_url: base,
    invite_url: `${base}/${SITE}/_invite/?code=SAMPLE-CODE`,
    expires_at: exp.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }),
    year: String(exp.getFullYear()),
  };
}
function render(s, vars, escape) {
  return s.replace(/\{\{\s*([a-z_]+)\s*\}\}/g, (_, k) => escape ? esc(vars[k] ?? "") : (vars[k] ?? ""));
}

async function preview(t) {
  current = t;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.id === t.id));
  const body = await (await fetch(`${t.id}.html`, { cache: "no-cache" })).text();
  const vars = sampleVars();
  $("tid").textContent = `${t.id}.html`;
  $("subject").textContent = render(t.subject, vars, false);
  $("to").textContent = me.email || "(no email on your account)";
  $("note").textContent = t.on ? `sent automatically on: ${t.on}` : (t.invite ? "mints a fresh 7-day invite link per send" : "");
  $("frame").srcdoc = render(body, vars, true);
  $("msg").textContent = "";
  $("send").disabled = !me.email;
}

$("send").addEventListener("click", async () => {
  if (!current) return;
  $("msg").className = "msg"; $("msg").textContent = "sending…";
  const res = await fetch(AUTH + "/email", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: me.username, website: SITE, template: current.id }),
  });
  if (!res.ok) { $("msg").className = "msg err"; $("msg").textContent = await res.text(); return; }
  const r = await res.json();
  $("msg").className = "msg ok"; $("msg").textContent = `sent "${r.subject}" to ${r.to}`;
});

async function boot() {
  const res = await fetch(AUTH + "/me");
  if (!res.ok) { $("status").innerHTML = 'Not logged in. <a href="/hxh/">Log in first</a>.'; return; }
  me = await res.json();
  if (!(me.roles || []).some(r => r.website === SITE && r.role === "admin")) { $("status").textContent = "Not authorized."; return; }
  manifest = await (await fetch("templates.json", { cache: "no-cache" })).json();
  const tabs = $("tabs");
  for (const t of manifest.templates) {
    const b = document.createElement("button");
    b.dataset.id = t.id; b.textContent = t.name;
    b.addEventListener("click", () => preview(t));
    tabs.append(b);
  }
  $("status").classList.add("hidden");
  $("view").classList.remove("hidden");
  if (manifest.templates[0]) preview(manifest.templates[0]);
}
boot();
</script>
</body>
</html>
