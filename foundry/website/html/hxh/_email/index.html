<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>hxh email templates</title>
<!-- Plain admin look on purpose (not the site theme), so the themed email
     inside the frame is unmistakably the email. -->
<link rel="stylesheet" href="/admin/assets/style.css?v=4">
<style>
  .tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin: .8rem 0; }
  .meta { display: flex; flex-wrap: wrap; gap: .4rem 1.4rem; align-items: baseline; color: var(--dim); margin-bottom: .6rem; }
  .meta b { color: var(--text); font-weight: 500; }
  .frame { border: 1px solid var(--line); background: #0b0a08; }
  .frame iframe { display: block; width: 100%; height: 760px; border: 0; pointer-events: none; }
  .actions { display: flex; gap: .6rem; align-items: center; margin-top: .8rem; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>hxh email templates</h1>
    <span class="who"><a href="/hxh/">site</a> · <a href="/admin/">admin</a></span>
  </header>

  <p id="status" class="msg">…</p>

  <section id="view" class="hidden">
    <div class="tabs" id="tabs"></div>
    <div class="meta">
      <span>template <b id="tid"></b></span>
      <span>subject <b id="subject"></b></span>
      <span>to <b id="to"></b></span>
    </div>
    <div class="frame"><iframe id="frame" title="Email preview" sandbox=""></iframe></div>
    <div class="actions">
      <button id="send" hidden>Send test to me</button>
      <span class="msg" id="msg" style="margin:0"></span>
    </div>
  </section>
</main>

<script>
// Query: ?template=<id> picks the tab; ?user=<username> previews as that
// user (needs the admin console role; falls back to yourself).
const AUTH = "/admin/api";
const SITE = "hxh";
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let me = null, who = null, manifest = null, layout = "", current = null;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function textColor(hex) {
  if (!/^#[0-9a-f]{6}$/i.test(hex || "")) return "#fff6e0";
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 170 ? "#0b0a08" : "#fff6e0";
}

// Same variable set the server substitutes (hobby-server
// internal/shared/email.go), with sample links.
function sampleVars(t) {
  const base = location.origin;
  const inv = new Date(Date.now() + 7 * 86400e3), rst = new Date(Date.now() + 3600e3);
  const ny = { timeZone: "America/New_York" };
  return {
    display_name: who.display_name, username: who.username, initial: who.initial,
    color: who.color, color_text: textColor(who.color),
    email: who.email || "", website: SITE,
    site_url: `${base}/${SITE}/`, base_url: base,
    invite_url: `${base}/${SITE}/_invite/?code=SAMPLE-CODE`,
    reset_url: `${base}/${SITE}/_reset/?code=SAMPLE-CODE`,
    expires_at: t.reset
      ? `${rst.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", ...ny })} at ${rst.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZoneName: "short", ...ny })}`
      : inv.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", ...ny }),
    year: String(new Date().getFullYear()),
  };
}
// Mirrors the server: escape everything except the layout's raw slots.
function render(s, vars, escape, raw = []) {
  return s.replace(/\{\{\s*([a-z_]+)\s*\}\}/g, (_, k) => (escape && !raw.includes(k)) ? esc(vars[k] ?? "") : (vars[k] ?? ""));
}

async function preview(t) {
  current = t;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.id === t.id));
  const body = await (await fetch(`${t.id}.html`, { cache: "no-cache" })).text();
  const vars = sampleVars(t);
  const subject = render(t.subject, vars, false);
  let html = render(body, vars, true);
  if (layout) {
    Object.assign(vars, { title: render(t.title || "", vars, false), kicker: render(t.kicker || "", vars, false), heading: render(t.heading || "", vars, false), subject, body: html });
    html = render(layout, vars, true, ["title", "kicker", "heading", "body"]);
  }
  $("tid").textContent = `${t.id}.html`;
  $("subject").textContent = subject;
  $("to").textContent = who.email || "(no email on the account)";
  $("frame").srcdoc = html;
  $("msg").textContent = "";
  $("send").hidden = who.username !== me.username;
  $("send").disabled = !me.email;
}

$("send").addEventListener("click", async () => {
  if (!current) return;
  $("msg").className = "msg"; $("msg").textContent = "sending…";
  const res = await fetch(AUTH + "/email", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: me.username, website: SITE, template: current.id }),
  });
  if (!res.ok) { $("msg").className = "msg err"; $("msg").textContent = await res.text(); return; }
  const r = await res.json();
  $("msg").className = "msg ok"; $("msg").textContent = `sent "${r.subject}" to ${r.to}`;
});

async function boot() {
  const res = await fetch(AUTH + "/me");
  if (!res.ok) { $("status").innerHTML = 'Not logged in. <a href="/hxh/">Log in first</a>.'; return; }
  me = await res.json();
  if (!(me.roles || []).some(r => r.website === SITE && r.role === "admin")) { $("status").textContent = "Not authorized."; return; }
  who = me;
  const asUser = params.get("user");
  if (asUser && asUser !== me.username) {
    try {
      const r = await fetch(AUTH + "/users");
      if (r.ok) who = (await r.json()).find(u => u.username === asUser) || me;
    } catch {}
  }
  manifest = await (await fetch("templates.json", { cache: "no-cache" })).json();
  if (manifest.layout !== "") {
    const r = await fetch(manifest.layout || "_layout.html", { cache: "no-cache" });
    if (r.ok) layout = await r.text();
  }
  const tabs = $("tabs");
  for (const t of manifest.templates) {
    const b = document.createElement("button");
    b.dataset.id = t.id; b.textContent = t.name;
    b.addEventListener("click", () => preview(t));
    tabs.append(b);
  }
  $("status").classList.add("hidden");
  $("view").classList.remove("hidden");
  const want = manifest.templates.find(t => t.id === params.get("template")) || manifest.templates[0];
  if (want) preview(want);
}
boot();
</script>
</body>
</html>
