<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hunter × Halloween — Roster DB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="retro.css?v=18">
<style>
  .desktop { padding: 16px 16px calc(var(--taskbar-h) + 16px); }
  #win-db { width: 100%; max-width: 62rem; margin: 0 auto; }
  .meta { text-align: center; color: var(--ink-4); margin-bottom: 14px; }
  #status { padding: 3rem 1rem; text-align: center; color: var(--ink-4); }

  .char {
    background: var(--paper-hi);
    border: var(--px) solid var(--ink);
    box-shadow: inset var(--px) var(--px) 0 var(--paper-lo), var(--px) var(--px) 0 var(--ink);
    margin-bottom: 14px; padding: 14px 12px 12px; text-align: center;
  }
  .char h2 { font: 12px/1.6 var(--font-px); margin: 0; }
  .char h2 .slug { display: block; font: 16px/1.2 var(--font-dot); color: var(--ink-4); letter-spacing: .2em; }
  .desc { max-width: 42rem; margin: 8px auto 0; }
  .strip { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 12px auto 4px; max-width: 48rem; }
  .strip a {
    flex: 0 0 auto; display: block; width: 100px; height: 100px; padding: 2px;
    background: var(--paper);
    border: var(--px) solid var(--ink);
    box-shadow: inset var(--px) var(--px) 0 var(--paper-hi), inset calc(-1 * var(--px)) calc(-1 * var(--px)) 0 var(--paper-lo);
  }
  .strip a:hover { border-color: var(--blood); }
  .strip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 10px; }
  .chip {
    display: inline-block; padding: 1px 6px 0;
    border: var(--px) solid var(--ink); background: var(--paper);
    line-height: 1.3;
  }
  .chip.nen { font-weight: bold; }
  .chip.weapon { background: var(--pumpkin); }
  .chip.arc { border-style: dashed; }
  .chip.card { background: var(--ink); color: var(--paper-hi); }
  .empty { color: var(--ink-4); }
  .hidden { display: none !important; }
</style>
</head>
<body class="nofloat">
<div class="desktop" id="desktop">
  <div class="win static" id="win-db" data-title="Roster DB" data-icon="db" data-noclose data-notask>
    <div class="mbar">
      <div class="menu"><button type="button"><u>F</u>ile</button>
        <div class="dd">
          <button type="button" data-act="site">Hunter Website</button>
          <hr>
          <button type="button" data-act="logout">Log out</button>
        </div></div>
      <div class="menu"><button type="button"><u>V</u>iew</button>
        <div class="dd"><button type="button" class="chk" data-crt>Scanlines</button></div></div>
    </div>
    <div class="body">
      <div id="status">…</div>
      <div id="view" class="hidden">
        <div class="meta" id="meta"></div>
        <div id="chars"></div>
      </div>
    </div>
  </div>
</div>
<div class="taskbar" id="taskbar"></div>
<div class="startmenu" id="startmenu"></div>

<script src="retro.js?v=32"></script>
<script>
const API = "/hxh/api";
const $ = id => document.getElementById(id);
const esc = Retro.esc;

const NEN_COLORS = {
  enhancement: "var(--enhancer)", transmutation: "var(--transmuter)",
  conjuration: "var(--conjurer)", emission: "var(--emitter)",
  manipulation: "var(--manipulator)", specialization: "var(--specialist)",
};

const ACT = {
  site: () => Retro.go("/hxh/"),
  logout: () => Retro.logout(),
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (b && ACT[b.dataset.act]) ACT[b.dataset.act]();
});
Retro.startMenu(() => [
  { label: "Hunter Website", icon: "x", onclick: ACT.site },
  "sep",
  { label: "Scanlines", icon: "crt", check: () => document.body.classList.contains("crt"),
    onclick: () => Retro.setCRT(!document.body.classList.contains("crt")) },
  "sep",
  { label: "Log out", icon: "door", onclick: ACT.logout },
]);

async function boot() {
  await Retro.os({ wallpaper: true, start: true, gate: true });
  let res;
  try {
    res = await fetch(API + "/roster");
  } catch {
    $("status").textContent = "Network error.";
    return;
  }
  if (res.status === 401) {
    $("status").textContent = "Session expired.";
    return;
  }
  if (res.status === 403) {
    $("status").textContent = "Exam committee only.";
    return;
  }
  if (!res.ok) {
    $("status").textContent = "Something went wrong.";
    return;
  }
  const { arcs, characters } = await res.json();
  render(arcs, characters);
  $("status").classList.add("hidden");
  $("view").classList.remove("hidden");
}

function render(arcs, characters) {
  const arcName = Object.fromEntries(arcs.map(a => [a.slug, a.name]));
  $("meta").textContent = `${characters.length} characters · ${arcs.length} arcs`;
  const box = $("chars");
  box.innerHTML = "";
  for (const c of characters) {
    const el = document.createElement("section");
    el.className = "char";
    const nen = c.nen_types.map(n => `<span class="chip nen" style="background:${NEN_COLORS[n] || "var(--paper-dim)"}">${esc(n)}</span>`).join("");
    const weapons = c.weapons.map(w => `<span class="chip weapon">${esc(w)}</span>`).join("");
    const arcChips = c.arcs.map(a => `<span class="chip arc" title="${esc(a)}">${esc(arcName[a] || a)}</span>`).join("");
    const strip = c.images.length
      ? `<div class="strip">${c.images.map(u =>
          `<a href="${esc(u)}" target="_blank" rel="noreferrer"><img src="${esc(u)}" loading="lazy" alt="${esc(c.name)}"></a>`).join("")}</div>`
      : `<p class="empty" style="margin:.6rem 0">no images</p>`;
    const card = `<span class="chip card">No.${String(c.no || 0).padStart(3, "0")} · ${esc(c.rank || "?")}</span>`
      + (c.affiliation ? `<span class="chip">${esc(c.affiliation)}</span>` : "");
    el.innerHTML = `
      <h2>${c.glyph ? esc(c.glyph) + " " : ""}${esc(c.name)} <span class="slug">${esc(c.name_ja || "")}${c.name_ja ? " · " : ""}${esc(c.slug)}${c.first ? " · " + esc(c.first) : ""}</span></h2>
      <p class="desc">${esc(c.description)}</p>
      ${strip}
      <div class="chips">${card}${nen}${weapons}${arcChips}</div>`;
    box.appendChild(el);
  }
}

boot();
</script>
</body>
</html>
