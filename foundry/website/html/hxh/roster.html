<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hunter × Halloween — Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b0a08;
    --ink-2: #14120e;
    --paper: #e8dcc3;
    --paper-dim: #a99c80;
    --blood: #c8102e;
    --blood-hot: #ff2444;
    --nen: #58e05c;
    --pumpkin: #ff7518;
    --enhancement: #ff5a36;
    --transmutation: #37d0ff;
    --conjuration: #c09bff;
    --emission: #ffd166;
    --manipulation: #ff7ad9;
    --specialization: #58e05c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: "Special Elite", "Courier New", monospace;
    line-height: 1.6;
    min-height: 100svh;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(200,16,46,.1), transparent 60%),
      radial-gradient(ellipse 60% 40% at 85% 110%, rgba(88,224,92,.06), transparent 60%);
  }
  main { position: relative; z-index: 1; max-width: 62rem; margin: 0 auto; padding: 2rem 1.25rem 5rem; }

  header.top {
    text-align: center;
    border-bottom: 1px solid rgba(232,220,195,.2);
    padding-bottom: 1.2rem; margin-bottom: .8rem;
  }
  header.top h1 {
    font-family: "Alfa Slab One", serif;
    font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: .02em;
    text-shadow: 0 4px 0 rgba(0,0,0,.55), 0 0 40px rgba(200,16,46,.3);
  }
  header.top h1 .x { color: var(--blood-hot); }
  header.top nav {
    position: fixed; top: .9rem; right: .9rem; z-index: 5;
    display: flex; gap: .5rem;
  }
  header.top a, header.top button {
    background: var(--ink);
    border: 1px solid rgba(232,220,195,.25);
    color: var(--paper-dim); font-family: "Special Elite", monospace;
    font-size: .7rem; letter-spacing: .15em; text-transform: uppercase;
    padding: .35rem .7rem; cursor: pointer; text-decoration: none;
  }
  header.top a:hover, header.top button:hover { color: var(--paper); border-color: var(--paper-dim); }
  .meta { text-align: center; color: var(--paper-dim); font-size: .8rem; margin-bottom: 2.4rem; }

  .char {
    border: 1px solid rgba(232,220,195,.18);
    background: linear-gradient(180deg, rgba(232,220,195,.03), transparent 60%);
    margin-bottom: 1.8rem;
    padding: 1.6rem 1.3rem 1.5rem;
    text-align: center;
  }
  .char h2 {
    font-family: "Alfa Slab One", serif;
    font-size: 1.45rem; letter-spacing: .02em;
  }
  .char h2 .slug {
    display: block;
    font-family: "Special Elite", monospace; font-size: .7rem;
    color: var(--paper-dim); letter-spacing: .25em; font-weight: normal;
    margin-top: .15rem;
  }
  .desc {
    font-size: .9rem; max-width: 42rem;
    margin: .8rem auto 0;
  }
  /* Centered wrap: an incomplete bottom row centers its tiles. */
  .strip {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: .5rem;
    margin: 1.1rem auto .3rem;
    max-width: 48rem;
  }
  .strip a {
    flex: 0 0 auto; display: block;
    width: 108px; height: 108px;
    border: 1px solid rgba(232,220,195,.2);
    background: var(--ink-2);
  }
  .strip img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    filter: saturate(.92);
  }
  .strip a:hover { border-color: var(--nen); }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: .25rem .35rem; margin-top: .8rem; }
  .chip {
    display: inline-block;
    border: 1px solid rgba(232,220,195,.25);
    padding: .05rem .5rem;
    font-size: .75rem; letter-spacing: .05em;
    color: var(--paper-dim);
  }
  .chip.nen { color: var(--ink); border: none; font-weight: bold; }
  .chip.weapon { color: var(--pumpkin); border-color: rgba(255,117,24,.5); }
  .chip.arc { border-style: dashed; }
  .empty { color: var(--paper-dim); font-size: .78rem; }

  #status { padding: 4rem 1rem; text-align: center; color: var(--paper-dim); }
  #status a { color: var(--nen); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <div id="status">…</div>

  <div id="view" class="hidden">
    <header class="top">
      <h1>The Roster <span class="x">×</span></h1>
      <nav>
        <a href="/hxh/">Site</a>
        <button id="logout">Log out</button>
      </nav>
    </header>
    <div class="meta" id="meta"></div>
    <div id="chars"></div>
  </div>
</main>

<script>
const API = "/hxh/api";
const AUTH = "/admin/api";
const $ = id => document.getElementById(id);

const NEN_COLORS = {
  enhancement: "var(--enhancement)", transmutation: "var(--transmutation)",
  conjuration: "var(--conjuration)", emission: "var(--emission)",
  manipulation: "var(--manipulation)", specialization: "var(--specialization)",
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function boot() {
  let res;
  try {
    res = await fetch(API + "/roster");
  } catch {
    $("status").textContent = "Network error.";
    return;
  }
  if (res.status === 401) {
    $("status").innerHTML = 'Not logged in. <a href="/hxh/">Log in first</a>.';
    return;
  }
  if (res.status === 403) {
    $("status").textContent = "Exam committee only.";
    return;
  }
  if (!res.ok) {
    $("status").textContent = "Something went wrong.";
    return;
  }
  const { arcs, characters } = await res.json();
  render(arcs, characters);
  $("status").classList.add("hidden");
  $("view").classList.remove("hidden");
}

function render(arcs, characters) {
  const arcName = Object.fromEntries(arcs.map(a => [a.slug, a.name]));
  $("meta").textContent = `${characters.length} characters · ${arcs.length} arcs`;
  const box = $("chars");
  box.innerHTML = "";
  for (const c of characters) {
    const el = document.createElement("section");
    el.className = "char";

    const nen = c.nen_types.map(n => `<span class="chip nen" style="background:${NEN_COLORS[n] || "var(--paper-dim)"}">${esc(n)}</span>`).join("");
    const weapons = c.weapons.map(w => `<span class="chip weapon">${esc(w)}</span>`).join("");
    const arcChips = c.arcs.map(a => `<span class="chip arc" title="${esc(a)}">${esc(arcName[a] || a)}</span>`).join("");
    const strip = c.images.length
      ? `<div class="strip">${c.images.map(u =>
          `<a href="${esc(u)}" target="_blank" rel="noreferrer"><img src="${esc(u)}" loading="lazy" alt="${esc(c.name)}"></a>`).join("")}</div>`
      : `<p class="empty" style="margin:.6rem 0">no images</p>`;

    el.innerHTML = `
      <h2>${esc(c.name)} <span class="slug">${esc(c.slug)}</span></h2>
      <p class="desc">${esc(c.description)}</p>
      ${strip}
      <div class="chips">${nen}${weapons}${arcChips}</div>`;
    box.appendChild(el);
  }
}

$("logout").addEventListener("click", async () => {
  await fetch(AUTH + "/logout", { method: "POST" });
  location.href = "/hxh/";
});

boot();
</script>
</body>
</html>
