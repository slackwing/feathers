<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklists! — Hedgie & Frogie's RV Adventure</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.prep-page {
  max-width: 760px;
  margin: 0 auto;
  padding: 32px 20px 80px;
}
@media (min-width: 760px) {
  .prep-page { padding: 56px 32px 100px; }
}
.prep-page h1 {
  font-family: var(--font-serif);
  font-size: clamp(1.9rem, 4vw, 2.6rem);
  margin: 0 0 6px;
}
.prep-page .lede {
  color: var(--ink-soft);
  margin: 0 0 32px;
}
.prep-section {
  margin-bottom: 40px;
}
.prep-section-header {
  display: flex;
  align-items: center;
  gap: 6px;
  border-bottom: 2px solid var(--line);
  padding-bottom: 6px;
  margin: 0 0 12px;
}
.prep-section-toggle {
  background: none;
  border: none;
  padding: 0 4px;
  color: var(--ink-soft);
  cursor: pointer;
  font-size: 0.8rem;
  line-height: 1;
}
.prep-section-toggle:hover { color: var(--ink); }
.prep-section-title {
  font-family: var(--font-serif);
  font-size: 1.4rem;
  margin: 0;
  color: var(--ink);
  flex: 1 1 auto;
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.prep-section-count {
  font-family: var(--font-sans, inherit);
  font-size: 0.78rem;
  color: var(--ink-soft);
  font-weight: 500;
  letter-spacing: 0.02em;
}
.prep-section-actions {
  flex: 0 0 auto;
  display: flex;
  gap: 2px;
  opacity: 0;
  transition: opacity 0.12s;
}
.prep-section-header:hover .prep-section-actions,
.prep-section-header:focus-within .prep-section-actions {
  opacity: 1;
}
.prep-section.is-collapsed .prep-section-body {
  display: none;
}
.prep-add-section {
  margin-top: 32px;
  padding-top: 18px;
  border-top: 1px dashed var(--line);
}
.prep-list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.prep-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 6px;
  border-radius: 6px;
  transition: background 0.12s;
}
.prep-item:hover { background: rgba(0,0,0,0.025); }
.prep-item.sortable-ghost { opacity: 0.4; background: rgba(0,0,0,0.05); }
.prep-item.sortable-chosen { background: rgba(0,0,0,0.04); }
/* Drag handle: a ✥ to the left of the checkbox. Reserves space always
   (so the row layout doesn't jitter on hover), but is only visible when
   the row is hovered/focused. Touch users: tap-and-hold on the row
   surfaces the drag; the handle is mostly a desktop affordance. */
.prep-handle {
  flex: 0 0 auto;
  width: 14px;
  margin-top: 2px;
  color: var(--ink-soft);
  cursor: grab;
  user-select: none;
  font-size: 0.95rem;
  line-height: 1;
  opacity: 0;
  transition: opacity 0.12s;
  text-align: center;
}
.prep-item:hover .prep-handle,
.prep-item:focus-within .prep-handle { opacity: 0.7; }
.prep-handle:hover { opacity: 1 !important; }
.prep-handle:active { cursor: grabbing; }
.prep-item input[type="checkbox"] {
  flex: 0 0 auto;
  margin-top: 3px;
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
  cursor: pointer;
}
.prep-item input[type="checkbox"]:disabled {
  cursor: not-allowed;
}
.prep-date {
  display: inline-block;
  background: var(--bg-warm);
  color: var(--ink-soft);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 4px;
  margin-right: 8px;
  vertical-align: 2px;
  white-space: nowrap;
}
.prep-text-wrap {
  flex: 1 1 auto;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  min-width: 0;
}
.prep-text {
  flex: 1 1 auto;
  line-height: 1.45;
  color: var(--ink);
  min-width: 0;
  word-wrap: break-word;
}
.prep-item.is-done .prep-text {
  text-decoration: line-through;
  color: var(--ink-soft);
}
.prep-text a {
  color: var(--accent);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}
.prep-text a:hover { text-decoration-thickness: 2px; }
.prep-text code {
  background: rgba(0,0,0,0.05);
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 0.9em;
}
.prep-edit-input {
  flex: 1 1 auto;
  font: inherit;
  color: var(--ink);
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: 4px 6px;
  background: white;
  outline: none;
  min-width: 0;
}
.prep-actions {
  flex: 0 0 auto;
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.12s;
}
.prep-item:hover .prep-actions,
.prep-item:focus-within .prep-actions { opacity: 1; }
.prep-action-btn {
  background: none;
  border: none;
  padding: 2px 6px;
  cursor: pointer;
  color: var(--ink-soft);
  font-size: 0.95rem;
  line-height: 1;
  border-radius: 4px;
}
.prep-action-btn:hover { background: rgba(0,0,0,0.06); color: var(--ink); }
.prep-add {
  margin-top: 10px;
  display: flex;
  gap: 8px;
}
/* Shared aesthetic for both "add item" and "add section" forms:
   32px-tall input + button, 1px deep-frog-green border, matching radii.
   Per-form overrides below control background and indent. */
.prep-add input[type="text"],
.prep-add button {
  font: inherit;
  height: 32px;
  box-sizing: border-box;
  padding: 4px 12px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  color: var(--ink);
  line-height: 1.2;
  outline: none;
}
.prep-add input[type="text"] { flex: 1 1 auto; }
.prep-add input[type="text"]::placeholder { color: var(--ink-soft); }
.prep-add input[type="text"]:focus { box-shadow: 0 0 0 2px rgba(47, 138, 110, 0.18); }
.prep-add button {
  flex: 0 0 auto;
  cursor: pointer;
  font-weight: 600;
  color: var(--accent);
}
.prep-add button:disabled { opacity: 0.5; cursor: not-allowed; }

/* Per-section "Add item" form: mint background, indented to align with
   the checkbox-item text column. */
.prep-add[data-section] {
  /* item padding-left 6 + handle 14 + gap 8 + checkbox 18 + gap 8 = 54 */
  padding-left: 54px;
}
.prep-add[data-section] input[type="text"],
.prep-add[data-section] button { background: var(--bg); }
.prep-add[data-section] button:hover { background: rgba(47, 138, 110, 0.08); }

/* "Add a section" form (bottom of page): white background, no indent,
   same height/border/button style. */
.prep-add-section input[type="text"],
.prep-add-section button { background: white; }
.prep-add-section button:hover { background: rgba(47, 138, 110, 0.06); }
.prep-back {
  display: inline-block;
  margin-bottom: 18px;
  color: var(--accent);
  font-size: 0.9rem;
  text-decoration: none;
}
.prep-back:hover { text-decoration: underline; }
.prep-progress {
  font-size: 0.85rem;
  color: var(--ink-soft);
  margin-top: 4px;
}
.prep-login-hint {
  font-size: 0.85rem;
  color: var(--ink-soft);
  margin-top: 4px;
  font-style: italic;
}
.prep-login-hint button {
  background: none;
  border: none;
  padding: 0;
  color: var(--accent);
  font: inherit;
  font-style: italic;
  cursor: pointer;
  text-decoration: underline;
}
.prep-toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.85);
  color: white;
  padding: 10px 18px;
  border-radius: 6px;
  font-size: 0.9rem;
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
.prep-toast.is-shown { opacity: 1; }
.prep-loading, .prep-empty {
  color: var(--ink-soft);
  font-style: italic;
  padding: 16px 0;
}
</style>
</head>
<body>

<div class="site-controls">
  <button class="site-login-btn" id="site-login-btn" type="button" aria-label="Log in">Log in</button>
  <div class="site-unit-toggle" id="site-unit-toggle" role="tablist" aria-label="Temperature unit (site-wide)">
    <button type="button" data-unit="C" role="tab" aria-selected="true">°C</button>
    <button type="button" data-unit="F" role="tab" aria-selected="false">°F</button>
  </div>
</div>

<div class="site-modal-overlay" id="site-login-modal" hidden>
  <div class="site-modal" role="dialog" aria-modal="true" aria-labelledby="site-login-title">
    <button class="site-modal-close" id="site-login-close" type="button" aria-label="Close">×</button>
    <h2 id="site-login-title">Log in</h2>
    <form id="site-login-form">
      <label class="site-modal-field">
        <span>Username</span>
        <input type="text" name="username" autocomplete="username" required>
      </label>
      <label class="site-modal-field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="site-modal-error" id="site-login-error" hidden></p>
      <button class="site-modal-submit" type="submit">Log in</button>
    </form>
  </div>
</div>

<div class="prep-page">
  <a class="prep-back" href="index.html">← Back to itinerary</a>
  <h1>Checklists!</h1>
  <p class="prep-login-hint" id="prep-login-hint" hidden>Read-only — <button type="button" id="prep-login-hint-btn">log in</button> to edit.</p>
  <div id="prep-root"></div>
</div>

<div class="prep-toast" id="prep-toast" role="status" aria-live="polite"></div>

<footer class="footer">
  <p>🦔 + 🐸 · <a href="index.html">Back to itinerary</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="assets/site-unit.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/celebrate.js"></script>
<script src="assets/prep.js"></script>
</body>
</html>
