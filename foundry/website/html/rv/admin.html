<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Hedgie & Frogie's RV Adventure</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.admin-page {
  max-width: 760px;
  margin: 0 auto;
  padding: 32px 20px 80px;
}
@media (min-width: 760px) {
  .admin-page { padding: 56px 32px 100px; }
}
.admin-back {
  display: inline-block;
  font-size: 0.85rem;
  color: var(--ink-soft);
  margin-bottom: 16px;
  text-decoration: none;
}
.admin-back:hover { color: var(--ink); text-decoration: underline; }
.admin-page h1 {
  font-family: var(--font-serif);
  font-size: clamp(1.9rem, 4vw, 2.6rem);
  margin: 0 0 6px;
}
.admin-page h2 {
  font-family: var(--font-serif);
  font-size: 1.4rem;
  margin: 32px 0 10px;
  border-bottom: 2px solid var(--line);
  padding-bottom: 6px;
}
.admin-lede {
  color: var(--ink-soft);
  margin: 0 0 24px;
}
.admin-login-hint {
  margin: 0 0 18px;
  color: var(--ink-soft);
  font-style: italic;
}
.admin-login-hint button {
  background: none;
  border: none;
  color: var(--accent);
  cursor: pointer;
  padding: 0;
  font: inherit;
  text-decoration: underline;
}
.admin-participants {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.admin-participant {
  display: grid;
  grid-template-columns: 24px 1fr 80px 40px auto;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
}
.admin-participant input[type="text"],
.admin-participant input[type="number"],
.admin-participant input[type="color"] {
  font: inherit;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fff;
  color: var(--ink);
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
}
.admin-participant input[type="color"] {
  padding: 0;
  height: 28px;
  cursor: pointer;
}
.admin-avatar-chip {
  width: 24px;
  height: 24px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 800;
  font-size: 0.75rem;
  overflow: hidden;
  flex-shrink: 0;
}
.admin-avatar-chip img { width: 100%; height: 100%; object-fit: cover; }
.admin-actions {
  display: flex;
  gap: 4px;
}
.admin-btn {
  font: inherit;
  font-size: 0.85rem;
  padding: 4px 10px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fff;
  color: var(--ink);
  cursor: pointer;
}
.admin-btn:hover { background: rgba(0,0,0,0.04); }
.admin-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.admin-btn.primary:hover { background: #257a60; }
.admin-btn.danger { color: #b02020; border-color: #e0b0b0; }
.admin-btn.danger:hover { background: #fff0f0; }
.admin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.admin-add-form {
  margin-top: 12px;
  padding-top: 18px;
  border-top: 1px dashed var(--line);
}
.admin-toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.85);
  color: white;
  padding: 10px 18px;
  border-radius: 6px;
  font-size: 0.9rem;
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
.admin-toast.is-shown { opacity: 1; }
.admin-loading, .admin-empty {
  color: var(--ink-soft);
  font-style: italic;
  padding: 12px 0;
}
</style>
</head>
<body>

<div class="site-controls">
  <button class="site-login-btn" id="site-login-btn" type="button" aria-label="Log in">Log in</button>
  <div class="site-unit-toggle" id="site-unit-toggle" role="tablist" aria-label="Temperature unit (site-wide)">
    <button type="button" data-unit="C" role="tab" aria-selected="true">°C</button>
    <button type="button" data-unit="F" role="tab" aria-selected="false">°F</button>
  </div>
</div>

<div class="site-modal-overlay" id="site-login-modal" hidden>
  <div class="site-modal" role="dialog" aria-modal="true" aria-labelledby="site-login-title">
    <button class="site-modal-close" id="site-login-close" type="button" aria-label="Close">×</button>
    <h2 id="site-login-title">Log in</h2>
    <form id="site-login-form">
      <label class="site-modal-field">
        <span>Username</span>
        <input type="text" name="username" autocomplete="username" required>
      </label>
      <label class="site-modal-field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="site-modal-error" id="site-login-error" hidden></p>
      <button class="site-modal-submit" type="submit">Log in</button>
    </form>
  </div>
</div>

<div class="admin-page">
  <a class="admin-back" href="index.html">← Back to itinerary</a>
  <h1>Admin</h1>
  <p class="admin-login-hint" id="admin-login-hint" hidden>You need to <button type="button" id="admin-login-hint-btn">log in</button> to make changes.</p>

  <h2>🍩 Dunkin' bet participants</h2>
  <p class="admin-lede">Edit names, guesses, colors, and stack order. Changes appear on the itinerary chart on next load.</p>

  <div id="admin-dunkin-root" class="admin-loading">Loading…</div>

  <div class="admin-add-form" id="admin-add-form" hidden>
    <h3 style="margin: 0 0 10px; font-family: var(--font-serif);">Add a bettor</h3>
    <div class="admin-participant" style="background: transparent;">
      <span class="admin-avatar-chip" id="new-chip" style="background: #4a7fa0;">?</span>
      <input type="text" id="new-name" placeholder="Name (e.g. Riley)" autocomplete="off">
      <input type="number" id="new-guess" placeholder="Guess" min="0" step="1">
      <input type="color" id="new-color" value="#4a7fa0">
      <div class="admin-actions">
        <button type="button" class="admin-btn primary" id="new-save">Add</button>
      </div>
    </div>
  </div>
</div>

<div class="admin-toast" id="admin-toast" role="status" aria-live="polite"></div>

<footer class="footer">
  <p>🦔 + 🐸 · <a href="index.html">Back to itinerary</a> · <a href="notes.html">Notes</a> · <a href="website.html">Website</a></p>
</footer>

<script src="assets/site-unit.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
