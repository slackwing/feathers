<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐸🦔 Hedgie & Frogie's RV Adventure</title>
<meta name="description" content="Andrew and Abi's cross-country RV trip itinerary, San Diego to NYC, July 2026.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="site-controls">
  <button class="site-login-btn" id="site-login-btn" type="button" aria-label="Log in">Log in</button>
  <div class="site-unit-toggle" id="site-unit-toggle" role="tablist" aria-label="Temperature unit (site-wide)">
    <button type="button" data-unit="C" role="tab" aria-selected="true">°C</button>
    <button type="button" data-unit="F" role="tab" aria-selected="false">°F</button>
  </div>
</div>

<!-- Login modal (hidden by default). Frame is a fixed overlay + centered
     dialog. Closing the modal (X, backdrop click, Esc) cancels login. -->
<div class="site-modal-overlay" id="site-login-modal" hidden>
  <div class="site-modal" role="dialog" aria-modal="true" aria-labelledby="site-login-title">
    <button class="site-modal-close" id="site-login-close" type="button" aria-label="Close">×</button>
    <h2 id="site-login-title">Log in</h2>
    <form id="site-login-form">
      <label class="site-modal-field">
        <span>Username</span>
        <input type="text" name="username" autocomplete="username" required>
      </label>
      <label class="site-modal-field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="site-modal-error" id="site-login-error" hidden></p>
      <button class="site-modal-submit" type="submit">Log in</button>
    </form>
  </div>
</div>

<header class="hero">
  <div class="hero-photo-wrap">
    <!-- The src is picked randomly per page load from HERO_PHOTOS below.
         To add or remove a photo, drop a file in assets/photos/hero/
         and edit that list. -->
    <img src="" alt="Andrew and Abi" class="hero-photo" id="hero-photo">
  </div>
  <script>
    (function () {
      // Each entry: filename, or {file, pos} for a per-photo
      // object-position override (overrides the 50% 22% default in
      // style.css). Use when a photo's faces sit lower/higher than
      // typical and the default crop loses them or wastes space.
      var HERO_PHOTOS = [
        "EDFD8785-7134-4751-B7E2-0E53E3B6B31B.JPG",
        "IMG_4083.jpg",
        "IMG_6135.jpg",
        "IMG_6217.jpg",
        { file: "IMG_6983.jpg", pos: "50% 55%" },
        { file: "IMG_7119.jpg", pos: "50% 45%" }
      ];
      var raw = HERO_PHOTOS[Math.floor(Math.random() * HERO_PHOTOS.length)];
      var entry = typeof raw === "string" ? { file: raw } : raw;
      var img = document.getElementById("hero-photo");
      if (img) {
        img.src = "assets/photos/hero/" + entry.file;
        if (entry.pos) img.style.objectPosition = entry.pos;
      }
    })();
  </script>
  <div class="hero-text">
    <p class="kicker">A trip across America</p>
    <h1>Hedgie <span class="amp">&</span> Frogie's<br>RV Adventure</h1>
    <p class="subtitle">San Diego → New York City<span class="prep-link-wrap"> · <a href="prep.html" class="prep-link" style="color:var(--accent)">checklists!</a> · <a href="notes.html" class="prep-link" style="color:var(--accent)">notes</a></span></p>
    <div class="legend">
      <div class="legend-item">
        <img src="assets/photos/abi-avatar.jpg" alt="Abi" class="avatar">
        <span class="legend-icon">🐸</span>
        <span class="legend-label">Abi's must-dos</span>
      </div>
      <div class="legend-item">
        <img src="assets/photos/andrew-avatar.jpg" alt="Andrew" class="avatar">
        <span class="legend-icon">🦔</span>
        <span class="legend-label">Andrew's must-dos</span>
      </div>
      <div class="legend-item legend-rv">
        <span class="legend-icon">🚐</span>
        <span class="legend-label">where we sleep</span>
      </div>
    </div>
  </div>
</header>

<!-- Route Map V2 — see MAP_V2_MECHANICS.md. Real-coord projection with
     pan/zoom. Major destinations as large dots; sleep spots as 🚐 emojis
     at real (lat,lon); junctions + spurs for off-route locations. -->
<section class="route-map-v2-section" aria-label="Route map">
  <div class="route-map-v2-wrap">
    <div class="route-map-v2-viewport" id="route-map-v2-viewport">
      <svg class="route-map-v2-svg" id="route-map-v2-svg" preserveAspectRatio="none" role="img" aria-label="Cross-country route with sleep spots"></svg>
    </div>
  </div>
</section>

<main class="trip">
  <!-- Vertical timeline rail (populated by itinerary.js after cards render) -->
  <aside class="timeline" aria-label="Trip timeline">
    <ol class="timeline-list">
      <!-- populated by JS -->
    </ol>
  </aside>

  <div class="stops" id="itinerary">
    <!-- Day cards rendered by itinerary.js from assets/trip.json -->
  </div>
</main>

<footer class="footer">
  <p>🦔 + 🐸<span class="prep-link-wrap"> · <a href="prep.html" class="prep-link">Checklists!</a> · <a href="notes.html" class="prep-link">Notes</a></span></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="assets/site-unit.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/itinerary.js"></script>
<script src="assets/map-v2.js"></script>
<!-- TEMPORARY: emoji rain for fun. Remove this line to turn it off. -->
<script src="assets/emoji-rain.js"></script>
</body>
</html>
